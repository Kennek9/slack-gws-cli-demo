<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#FFF8E9">
<link rel="icon" href="data:,">
<title>How we work together · 合并后的协作方式</title>
<style>
:root {
  --paper: #fff8e9;
  --warm: #ffead2;
  --orange: #ff4e00;
  --ink: #232222;
  --muted: #69605b;
  --cn: #574d48;
  --label: #96390c;
  --card: #fffdf8;
  --line: #eadbc8;
  --line-strong: #d6bc9f;
  --mark: #ffd3aa;
  --good: #ffe1c4;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --ease: cubic-bezier(.2, .72, .2, 1);
  --r-lg: 1.15cqw;
  --r-md: .8cqw;
  --r-sm: .5cqw;
  --edge: max(1px, .06cqw);
  --shadow: 0 .1cqw .3cqw #6b3f1a0d, 0 .9cqw 2.4cqw #6b3f1a14;
  font-family: var(--sans);
  color: var(--ink);
  background: #f3e7d6;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; }
h1, h2, h3, p, figure, blockquote, ol, ul, table { margin: 0; }
ol, ul { padding: 0; list-style: none; }
button, select, textarea { font: inherit; color: inherit; }
button, select, a { touch-action: manipulation; }
button:focus-visible, select:focus-visible, a:focus-visible, textarea:focus-visible { outline: 2px solid var(--orange); outline-offset: 3px; }
.ico { width: 1em; height: 1em; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

/* Stage */
#presenter { min-height: 100dvh; display: grid; place-content: center; justify-items: center; background: #f3e7d6; }
#screen, .toolbar { width: min(100vw, calc((100dvh - 51px) * 16 / 9)); }
#screen { position: relative; container-type: inline-size; overflow: hidden; aspect-ratio: 16 / 9; background: var(--paper); }
#presenter:fullscreen #screen { width: min(100vw, calc(100dvh * 16 / 9)); }
#presenter:fullscreen .toolbar { display: none; }
.scene { position: absolute; inset: 0; display: flex; flex-direction: column; padding: 2.9cqw 5.6cqw 2.3cqw; background: var(--paper); animation: scene-in .35s ease-out both; }
.scene.warm { background: radial-gradient(110% 85% at 90% 105%, #ffe5c9 0%, transparent 62%), var(--paper); }
.mast { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: .92cqw; font-weight: 600; letter-spacing: .06em; }
.track { display: flex; gap: 2.1cqw; }
.track li { display: inline-flex; align-items: center; gap: .45em; color: #ab9d93; }
.track .n { display: inline-grid; place-items: center; width: 1.45cqw; aspect-ratio: 1; border-radius: 50%; background: #efe2d3; color: #8f7f74; font-size: .78cqw; letter-spacing: 0; }
.track li.on { color: var(--ink); }
.track li.on .n { background: var(--orange); color: #fff; }
.track .cn { color: inherit; letter-spacing: .02em; }
.head { margin-top: 2.4cqw; }
.eyebrow { font-size: 1.12cqw; font-weight: 650; color: var(--label); }
.eyebrow .cn { color: #7a4a33; }
h1 { font-family: var(--serif); font-weight: 400; font-size: 3.2cqw; line-height: 1.08; }
h1 .cn { color: var(--muted); font-family: var(--sans); margin-top: .28em; }
.main { flex: 1; min-height: 0; margin-top: 2.2cqw; }
.foot { margin-top: auto; padding-top: 1cqw; font-size: 1cqw; color: var(--muted); }
.foot::before { content: ""; display: inline-block; width: .4cqw; aspect-ratio: 1; margin-right: .6cqw; border-radius: 50%; background: #d9b796; vertical-align: .15cqw; }
.foot a { color: var(--label); font-weight: 600; }

/* Bilingual: both, English only, Chinese only */
.cn { color: var(--cn); font-family: var(--sans); }
.bi > span { display: block; }
.bi > .cn { margin-top: .22em; }
.biline > .cn { margin-left: .5em; }
.no-chinese .cn { display: none !important; }
#screen[data-language="zh"] [lang="en"] { display: none !important; }
#screen[data-language="zh"] .bi > .cn, #screen[data-language="zh"] .biline > .cn { margin: 0; }

/* Shared pieces */
.card { background: var(--card); border: var(--edge) solid var(--line-strong); border-radius: var(--r-lg); box-shadow: var(--shadow); }
.tag { display: inline-flex; align-items: center; gap: .4em; margin-left: auto; padding: .2cqw .6cqw; border-radius: 999px; background: #fdebd6; color: #7d4021; font-size: .88cqw; font-weight: 600; white-space: nowrap; }
.tag .cn { color: inherit; }
mark { color: inherit; padding: 0 .08em; border-radius: .2em; background: linear-gradient(var(--mark), var(--mark)) no-repeat 0 88% / 100% 64%; animation: mark-in .6s var(--ease) var(--md, 0s) backwards; }
code { font-family: var(--mono); font-size: .92em; padding: .05em .35em; border-radius: .3em; background: #fbe6cf; color: #6b3012; }
.arrive { animation: arrive .6s var(--ease) var(--d, 0s) both; }
.paper-in { animation: paper-in .8s var(--ease) var(--d, 0s) both; }
.unfold { animation: unfold .8s var(--ease) var(--d, 0s) backwards; }
@keyframes scene-in { from { opacity: 0; } }
@keyframes arrive { from { opacity: 0; transform: translateY(.8cqw); } }
@keyframes paper-in { from { opacity: 0; transform: translateY(1.5cqw); } }
@keyframes unfold { from { opacity: 0; transform: translateY(.6cqw); clip-path: inset(0 0 100% 0 round var(--r-lg)); } to { clip-path: inset(0 0 0 0 round var(--r-lg)); } }
@keyframes mark-in { from { background-size: 0% 64%; } }
@keyframes w-in { from { opacity: 0; } }
@keyframes rise { from { opacity: 0; transform: translateY(2cqw) scaleY(.9); } }

/* Before / After */
.ba { display: grid; grid-template-columns: 27cqw 1fr; gap: 2cqw; align-items: start; }
.ba-k { display: flex; align-items: center; gap: .5em; margin-bottom: .7cqw; font-size: 1cqw; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.ba-k .cn { text-transform: none; letter-spacing: 0; color: inherit; }
.ba-k .tag { text-transform: none; letter-spacing: 0; }
.before { padding: 1.3cqw 1.4cqw 1.4cqw; background: #faf3e8; border-style: dashed; box-shadow: none; color: #4d4440; }
.before .bi { font-size: 1.36cqw; line-height: 1.32; }
.after-k { color: var(--label); }
.after-col { display: grid; gap: 1.1cqw; }
.also { margin-top: 1.2cqw; display: flex; flex-wrap: wrap; align-items: center; gap: .6cqw; font-size: 1cqw; }
.also .k { color: var(--label); font-weight: 650; margin-right: .2cqw; }
.also .pill { padding: .3cqw .75cqw; border: var(--edge) solid var(--line-strong); border-radius: 999px; background: var(--card); }

/* Ask an AI Agent to use Google Workspace CLI */
.agent-card { overflow: hidden; }
.agent-header { padding: .65cqw 1.3cqw; color: var(--label); font-size: 1.13cqw; font-weight: 700; background: #fff2e1; border-bottom: var(--edge) solid var(--line); }
.agent-body { padding: 1.08cqw 1.3cqw 1.16cqw; }
.agent-prompt { font-size: 1.49cqw; line-height: 1.31; }
.agent-prompt > span:first-child { font-family: var(--serif); }
.agent-flow { margin-top: .8cqw; font-size: 1.12cqw; color: var(--label); font-weight: 650; }
.example-row { display: grid; grid-template-columns: 1.12fr 2fr; gap: .8cqw; padding: .5cqw 0; border-top: var(--edge) solid var(--line); font-size: 1.28cqw; line-height: 1.25; }
.example-row .k { color: var(--label); font-weight: 700; }

/* Output cards */
.out { padding: 1cqw 1.3cqw 1.15cqw; }
.out-head { display: flex; align-items: center; gap: .55cqw; margin-bottom: .75cqw; font-size: 1cqw; font-weight: 650; color: #6a4630; }
.out-head .ico { font-size: 1.25cqw; color: var(--label); }
.out-text { font-size: 1.45cqw; line-height: 1.28; }
.out-text > span:first-child { font-family: var(--serif); }

/* 01 Opening */
.s-open h1 { font-size: 4cqw; }
.layers { display: flex; flex-direction: column; justify-content: flex-end; gap: .9cqw; margin-top: 2.2cqw; }
.layer { display: grid; grid-template-columns: 4cqw 1fr auto; align-items: center; gap: 1.4cqw; padding: 1.2cqw 1.8cqw; border-radius: var(--r-lg); border: var(--edge) solid var(--line-strong); background: var(--card); box-shadow: var(--shadow); transform-origin: bottom; animation: rise .7s var(--ease) var(--d) both; }
.layer .num { font-family: var(--serif); font-size: 3cqw; line-height: 1; color: var(--orange); }
.layer .bi { font-size: 1.7cqw; font-weight: 650; }
.layer .sub { font-size: 1.15cqw; font-weight: 400; color: var(--muted); text-align: right; }
.layer.l3 { width: 64%; background: #fff1e0; border-color: #e3a678; }
.layer.l2 { width: 82%; }
.layer.l1 { width: 100%; }

/* 02 Hours */
.hours-grid { display: grid; grid-template-columns: 30cqw 1fr; gap: 2cqw; align-items: start; }
.ba-stack { display: grid; gap: .8cqw; }
.ba-line { display: grid; grid-template-columns: 7.4cqw 1fr; gap: .8cqw; align-items: baseline; padding: .9cqw 1.1cqw; border-radius: var(--r-md); font-size: 1.22cqw; line-height: 1.3; }
.ba-line.before-line { background: #faf3e8; border: var(--edge) dashed var(--line-strong); color: #4d4440; }
.ba-line.after-line { background: #fff4e6; border: var(--edge) solid #e3a678; }
.ba-line .ba-k { margin: 0; white-space: nowrap; }
.rule-card { margin-top: 1.1cqw; padding: 1.2cqw 1.35cqw 1.35cqw; }
.rule-card .bi { font-size: 1.3cqw; font-weight: 650; line-height: 1.3; }
.windows { display: flex; flex-wrap: wrap; align-items: center; gap: .7cqw; margin-top: .9cqw; }
.win { padding: .4cqw .8cqw; border-radius: var(--r-md); background: var(--orange); color: #fff; font-size: 1.4cqw; font-weight: 700; font-variant-numeric: tabular-nums; }
.or { color: var(--muted); font-size: 1.05cqw; }
.table-card { padding: .9cqw 1.2cqw 1.1cqw; }
.hours-table { width: 100%; border-collapse: collapse; font-size: 1.25cqw; }
.hours-table th, .hours-table td { padding: .7cqw .8cqw; border-bottom: var(--edge) solid var(--line); text-align: left; }
.hours-table thead th { color: var(--label); font-size: 1cqw; }
.hours-table thead th b { display: block; margin-top: .15cqw; color: var(--ink); font-size: 1.25cqw; font-variant-numeric: tabular-nums; }
.hours-table tbody th { font-weight: 650; }
.hours-table tbody th .city { display: block; color: var(--muted); font-size: .92cqw; font-weight: 400; }
.hours-table td { font-variant-numeric: tabular-nums; color: #8f8178; }
.hours-table td.good { color: var(--ink); font-weight: 700; background: var(--good); }
.hours-table td .prev { display: block; font-size: .85cqw; font-weight: 500; color: var(--muted); }
.legend { display: flex; align-items: center; gap: .5cqw; margin-top: .8cqw; font-size: .95cqw; color: var(--muted); }
.swatch { display: inline-block; width: 1.1cqw; height: .8cqw; border-radius: .2cqw; background: var(--good); border: var(--edge) solid #e3a678; }

/* 03 Tada thread */
.thread { padding: 1.2cqw 1.4cqw 1.3cqw; }
.tmsg { display: grid; grid-template-columns: 2.5cqw 1fr; gap: .9cqw; }
.tmsg + .tmsg { margin-top: 1.1cqw; padding-top: 1.1cqw; border-top: var(--edge) solid var(--line); }
.tav { width: 2.5cqw; aspect-ratio: 1; display: grid; place-items: center; border-radius: 26%; background: #f2dcc6; color: #6b3417; font-weight: 700; font-size: 1.05cqw; }
.tav.bot { background: var(--orange); color: #fff; }
.who { font-size: .98cqw; font-weight: 700; margin-bottom: .3cqw; }
.who .time { margin-left: .5cqw; color: var(--muted); font-weight: 400; }
.tmsg .bi { font-size: 1.35cqw; line-height: 1.3; }
.hit { display: grid; grid-template-columns: auto 1fr; gap: .2cqw .8cqw; align-items: center; margin-top: .7cqw; padding: .8cqw 1cqw; border: var(--edge) solid #e3c4a4; border-radius: var(--r-md); background: #fff8ef; }
.hit > .ico { grid-row: span 2; font-size: 2cqw; color: var(--label); }
.hit .title { font-size: 1.35cqw; font-weight: 700; }
.hit .meta { font-size: .95cqw; color: var(--muted); }
.more { margin-top: .6cqw; font-size: 1.05cqw; color: var(--muted); }
.ask-around { display: grid; gap: .5cqw; margin-top: 1cqw; }
.bubble { justify-self: start; max-width: 92%; padding: .45cqw .8cqw; border-radius: .9cqw .9cqw .9cqw .25cqw; background: #f1e5d6; font-size: 1cqw; color: #5d524c; }
.bubble:nth-child(2) { justify-self: end; border-radius: .9cqw .9cqw .25cqw .9cqw; }

/* 04 Use Tada */
.use-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.5cqw; }
.use { display: flex; flex-direction: column; gap: .8cqw; padding: 1.4cqw 1.5cqw 1.5cqw; }
.use-ico { width: 3cqw; aspect-ratio: 1; display: grid; place-items: center; border-radius: 50%; background: #fdebd6; color: var(--label); font-size: 1.5cqw; }
.use h2 { font-size: 1.65cqw; line-height: 1.2; }
.use h2 .cn { color: var(--ink); }
.use .how { font-size: 1.3cqw; line-height: 1.3; font-weight: 600; }
.use .bi.note { font-size: 1.15cqw; line-height: 1.3; color: var(--muted); }
.use-foot { display: flex; justify-content: space-between; align-items: center; gap: 1.5cqw; margin-top: 1.6cqw; }
.tips { display: flex; flex-wrap: wrap; gap: .6cqw 1.6cqw; font-size: 1.1cqw; }
.tips li { display: inline-flex; align-items: center; gap: .4cqw; }
.tips .ico { color: var(--orange); stroke-width: 2.4; font-size: 1.2cqw; }
.guide { display: inline-flex; align-items: center; gap: .5em; padding: .7cqw 1.15cqw; border-radius: .65cqw; background: #9f350b; color: #fff; font-size: 1.2cqw; font-weight: 700; text-decoration: none; white-space: nowrap; cursor: pointer; border: 0; }
.guide:hover { background: #792604; }
.guide .cn { color: #fff; }
.guide.ghost { background: transparent; color: #7d310e; border: var(--edge) solid #c98f66; }
.guide.ghost .cn { color: #7d310e; }
.guide.ghost:hover { background: #ffe5cc; }

/* 05 Searchable */
.locked { display: flex; flex-wrap: wrap; gap: .5cqw; margin-top: 1cqw; }
.locked > span { display: inline-flex; align-items: center; gap: .35cqw; padding: .35cqw .7cqw; border-radius: 999px; background: #efe5d9; color: #6f645d; font-size: .95cqw; }
.rules { display: grid; gap: .8cqw; }
.rules li { display: grid; grid-template-columns: 2.4cqw 1fr; gap: 1cqw; align-items: start; padding: 1cqw 1.2cqw; border: var(--edge) solid var(--line); border-radius: var(--r-md); background: #fffaf3; }
.rules .n { width: 2.2cqw; aspect-ratio: 1; display: grid; place-items: center; border-radius: 50%; background: var(--orange); color: #fff; font-weight: 700; font-size: 1.05cqw; }
.rules .bi { font-size: 1.4cqw; line-height: 1.28; font-weight: 600; }
.rules .bi .how { display: block; margin-top: .3cqw; font-size: 1.02cqw; font-weight: 400; color: var(--muted); }

/* 06 Permissions */

/* 10 Close */
.start { display: grid; gap: 1cqw; align-content: start; }
.start li { display: grid; grid-template-columns: 4cqw 1fr auto; align-items: center; gap: 1.4cqw; padding: 1.25cqw 1.6cqw; border: var(--edge) solid var(--line-strong); border-radius: var(--r-lg); background: var(--card); box-shadow: var(--shadow); }
.start .num { font-family: var(--serif); font-size: 2.8cqw; line-height: 1; color: var(--orange); }
.start .bi { font-size: 1.55cqw; font-weight: 650; line-height: 1.25; }
.start .when { display: block; margin-bottom: .35cqw; color: var(--label); font-size: 1cqw; font-weight: 650; }
.start .when .cn { color: inherit; }
.start li:last-child { background: #fff1e0; border-color: #e3a678; }

/* Toolbar and dialogs */
.toolbar { min-height: 49px; display: flex; gap: 6px; padding: 7px 10px; align-items: center; font-size: 12px; color: #61483a; }
.toolbar button, .toolbar select { border: 1px solid #c7ae93; border-radius: 6px; background: #fff8ed; color: #65432c; padding: 5px 9px; cursor: pointer; }
.toolbar button:hover, .toolbar select:hover { background: #ffe6cc; }
.toolbar button:disabled { opacity: .5; cursor: default; }
.toolbar select { min-width: 0; max-width: 46vw; }
.toolbar .push { flex: 1; }
#notes { max-height: 86vh; width: min(740px, 92vw); padding: 24px 26px; border: 1px solid #9e8165; border-radius: 14px; background: var(--paper); color: var(--ink); font-size: 15px; }
#notes::backdrop { background: #1b1512ba; }
#notes header { display: flex; justify-content: space-between; gap: 16px; align-items: center; }
#notes h2 { font-family: var(--serif); font-weight: 400; font-size: 23px; }
#notes h3 { margin-top: 18px; font-size: 14px; color: #7d310e; }
#notes p, #notes li { line-height: 1.6; }
#notes p { margin-top: 8px; }
#notes ul, #notes ol { margin-top: 6px; padding-left: 20px; }
#notes ul { list-style: disc; }
#notes ol { list-style: decimal; }
#notes li + li { margin-top: 6px; }
#notes li > p { margin-top: 4px; }
#notes a { color: #7d310e; }
#notes code { padding: 1px 5px; border-radius: 4px; background: #fbe6cf; font-family: var(--mono); font-size: 13px; word-break: break-all; }
#notes code.cmd { display: block; width: fit-content; max-width: 100%; margin-top: 6px; padding: 4px 8px; }
#notes small { display: block; margin-top: 18px; color: var(--muted); }
#notes button { padding: 6px 10px; border: 1px solid var(--line-strong); border-radius: 6px; background: #ffe8cf; cursor: pointer; }
.request-box { margin-top: 10px; padding: 12px; border: 1px solid var(--line-strong); border-radius: 8px; background: #fff2df; }
.request-box label { display: block; font-size: 13px; font-weight: 650; color: #753610; }
.request-box textarea { display: block; width: 100%; min-height: 108px; margin: 8px 0; padding: 8px; border: 1px solid var(--line-strong); border-radius: 5px; background: #fffaf1; font-size: 13px; line-height: 1.5; resize: vertical; }
.request-box [role="status"] { margin-left: 8px; font-size: 12px; color: #753610; }
@media (max-width: 720px) {
  #screen, .toolbar { width: min(100vw, calc((100dvh - 86px) * 16 / 9)); }
  .toolbar { flex-wrap: wrap; justify-content: center; min-height: 80px; }
  .toolbar .push { display: none; }
}
@media (max-width: 600px) and (orientation: portrait) {
  #presenter { display: flex; flex-direction: column; align-items: stretch; }
  #screen, #presenter:fullscreen #screen { width: 100%; aspect-ratio: auto; overflow: visible; container-type: normal; }
  #screen .scene { position: relative; min-height: calc(100dvh - 92px); padding: 18px; font-size: 13px; }
  #screen .scene * { font-size: inherit; }
  #screen .scene h1 { font-size: 26px; }
  #screen .scene .layer .num, #screen .scene .start .num { font-size: 22px; }
  .toolbar { width: 100%; position: sticky; bottom: 0; z-index: 1; background: #f3e7d6; }
  .mast { letter-spacing: 0; }
  .track { gap: 6px; flex-wrap: wrap; }
  .track .n { width: 16px; }
  .head, .main { margin-top: 14px; }
  .ba, .hours-grid, .use-grid, .duo-out, .perm-rule { grid-template-columns: 1fr; gap: 10px; }
  .layer, .start li { width: 100% !important; grid-template-columns: 28px 1fr; padding: 10px; gap: 8px; }
  .layer .sub { grid-column: 2; text-align: left; }
  .start li > :last-child { grid-column: 2; justify-self: start; }
  .card, .before, .out, .thread, .use, .rule-card, .table-card { padding: 10px; }
  .perm th, .perm td, .hours-table th, .hours-table td { padding: 6px 5px; }
  .use-foot { display: grid; gap: 10px; }
  .tav, .use-ico, .rules .n { width: 22px; }
  .rules li, .doc-lines li, .tmsg, .ba-line { grid-template-columns: 28px 1fr; gap: 6px; }
  .ba-line { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01s !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; transition-duration: .01s !important; }
}
</style>
</head>

        <p class="bi"><span lang="en">The next meeting and its preparation points.</span><span class="cn" lang="zh-Hans">知道下一场会是什么，以及需要准备什么。</span></p>
      </div>
      <div class="after-col">
        <div class="card agent-card paper-in" style="--d:.3s">
          <p class="agent-header biline"><span lang="en">Your message</span><span class="cn" lang="zh-Hans">你在 AI Agent 里输入</span></p>
          <div class="agent-body">
            <p class="agent-prompt bi"><span lang="en">Use Google Workspace CLI to check my next meeting. Read any linked Google Doc and give me two things to prepare. Tell me if there isn’t one.</span><span class="cn" lang="zh-Hans">用 Google Workspace CLI 看我的下一场会。读会议附的 Google 文档，给我两条准备事项；没有文档就告诉我。</span></p>
            <p class="agent-flow biline"><span lang="en">Your AI Agent uses the CLI to read Calendar and Docs</span><span class="cn" lang="zh-Hans">AI Agent 调用 CLI 读取日历和文档</span></p>
          </div>
        </div>
        <div class="card out unfold" style="--d:2.3s">
          <p class="out-head biline"><span lang="en">Example reply</span><span class="cn" lang="zh-Hans">示例回复</span></p>
          <div class="example-row"><span class="k">14:00</span><span class="biline"><span lang="en">Product review</span><span class="cn" lang="zh-Hans">产品评审</span></span></div>
          <div class="example-row"><span class="k biline"><span lang="en">Prepare</span><span class="cn" lang="zh-Hans">会前准备</span></span><span class="bi"><span lang="en">Confirm scope and check the timeline.</span><span class="cn" lang="zh-Hans">确认范围，核对时间。</span></span></div>
          <div class="example-row"><span class="k biline"><span lang="en">Source</span><span class="cn" lang="zh-Hans">来源</span></span><span class="biline"><span lang="en">Calendar + meeting doc</span><span class="cn" lang="zh-Hans">日历 + 会议文档</span></span></div>
        </div>
      </div>
    </div>
    <p class="foot biline"><span lang="en">Practice example · Actual meetings and documents depend on your account.</span><span class="cn" lang="zh-Hans">演练示例 · 实际会议与资料以你的账号为准。</span></p>
  </section>
</template>

<template id="close">
  <section class="scene s-close warm" data-label="Start this week · 这周开始">
    <header class="head arrive"><h1 class="bi"><span lang="en">One step per layer, starting this week</span><span class="cn" lang="zh-Hans">每一层先做一步，这周开始</span></h1></header>
    <ol class="main start">
      <li class="arrive" style="--d:.3s"><span class="num">1</span><span><span class="when biline"><span lang="en">Today</span><span class="cn" lang="zh-Hans">今天</span></span><span class="bi"><span lang="en">Set your working hours in Google Calendar.</span><span class="cn" lang="zh-Hans">在 Google 日历里标好工作时间。</span></span></span><a class="guide ghost biline" target="_blank" rel="noopener noreferrer" href="https://support.google.com/calendar/answer/7638168?co=GENIE.Platform%3DDesktop"><span lang="en">How to set it ↗</span><span class="cn" lang="zh-Hans">设置方法</span></a></li>
      <li class="arrive" style="--d:.55s"><span class="num">2</span><span><span class="when biline"><span lang="en">After this meeting</span><span class="cn" lang="zh-Hans">会后</span></span><span class="bi"><span lang="en">Ask Tada one real question.</span><span class="cn" lang="zh-Hans">问 Tada 一个手头的真实问题。</span></span></span><a class="guide ghost biline" data-guide target="_blank" rel="noopener noreferrer"><span lang="en">Tada guide ↗</span><span class="cn" lang="zh-Hans">中英教程</span></a></li>
      <li class="arrive" style="--d:.8s"><span class="num">3</span><span><span class="when biline"><span lang="en">This week</span><span class="cn" lang="zh-Hans">这周</span></span><span class="bi"><span lang="en">Ask your AI Agent to use Google Workspace CLI for one task.</span><span class="cn" lang="zh-Hans">让 AI Agent 用 Google Workspace CLI 完成一件事。</span></span></span><button type="button" class="guide biline" data-open-setup><span lang="en">Setup + examples</span><span class="cn" lang="zh-Hans">安装和示例</span></button></li>
    </ol>
  </section>
</template>

<script>
const guideUrl = "https://docs.google.com/document/d/1BOI80LqwMVBZFWf1ZwdUfLRzD_eu_ZL5rbjGNcDmmO4/edit";
const prompts = {
  tada: {
    name: "问 Tada：找一份公司资料",
    en: "@Tada Where is the Beijing office onboarding guide? Give me the original link.",
    zh: "@Tada 北京办公室的入职指南在哪？给我原文链接。",
    chips: []
  },
  gwsSetup: {
    name: "让 AI Agent 总结文档",
    en: "Use Google Workspace CLI to read this document. Give me three key points and the source link.",
    zh: "用 Google Workspace CLI 读这份文档，给我三个重点并附来源。",
    chips: [{slotEn: "Google Doc", slotZh: "Google 文档", linkEn: "Google Doc link", linkZh: "Google 文档链接"}]
  },
  gwsReview: {
    name: "评审前整理文档",
    en: "Use Google Workspace CLI to read this Google Doc. For the review, list what is in this release and what comes later. Include the link.",
    zh: "用 Google Workspace CLI 读这份 Google 文档。评审时要同步什么？列出本期和后续内容，并附文档链接。",
    chips: [{slotEn: "Google Doc", slotZh: "Google 文档", linkEn: "Google Doc link", linkZh: "Google 文档链接"}]
  },
  gwsAgenda: {
    name: "为下一场会议做准备",
    en: "Use Google Workspace CLI to check my next meeting. Read any linked Google Doc and give me two things to prepare. Tell me if there is not one.",
    zh: "用 Google Workspace CLI 看我的下一场会。读会议附的 Google 文档，给我两条准备事项；没有文档就告诉我。",
    chips: []
  }
};

const setupSteps = [
  {
    title: "Tada · 在 Slack 里",
    en: "Ask in a channel Tada is in, or DM Tada. To read your own Drive files: Tada Home → Open my workspace → Google Drive → Connect, choose the work account that matches your Slack email, then send Drive: plus a link in your DM. No reply? Ask Ken.",
    zh: "在 Tada 所在的频道里 @Tada，或私聊 Tada。要读自己的 Drive 文件：Tada 主页 → 打开我的工作台 → Google Drive → 连接，选和 Slack 邮箱一致的公司账号，再在私聊里发 Drive: 加链接。没回复，找 Ken。"
  },
  {
    title: "gws · Google Workspace CLI",
    en: "Ask your AI Agent to install and configure gws where it runs. Sign in to your work account when prompted and grant the access needed for your task. The setup may require a Google Cloud project and OAuth client; see the official guide.",
    zh: "请 AI Agent 在它运行的环境里安装并配置 gws，按提示登录工作账号，并授予任务所需的权限。配置可能需要 Google Cloud 项目和 OAuth 客户端，详见官方说明。"
  }
];
const setupLinks = [
  ["Tada · 中英教程（公司账号）", guideUrl],
  ["gws · Install and sign in", "https://github.com/googleworkspace/cli#installation"]
];

const chapters = [
  { id: "opening", stage: -1, time: "0:00–0:20",
    say: ["合并之后，我们先建立一套共同的工作方式，再学习让 AI Agent 使用 Google Workspace CLI。", "分三层：先找到彼此，再找到信息，最后学习如何使用 Google Workspace CLI。"] },
  { id: "hours", stage: 0, time: "0:20–1:05",
    say: ["第一层，先让大家找到彼此。约定：中国同事至少开放北京时间 08:00–10:00 或 22:00–24:00 中的一段，并在 Google 日历里标明工作时间。", "表里高亮的是对方白天能用的时段。设置方法：电脑打开 Google 日历 → 设置 → 通用 → 工作时间（或「工作时间和地点」）→ 启用。找不到这个设置，反馈给 Operation Team。"],
    facts: ["时间按打开页面当天的北京日期换算，会自动跟随夏令时。高亮规则：对方当地 07:00–21:00 之间的时段。", "Google 官方说明：看不到工作时间选项，通常是管理员没有为组织开启。"] },
  { id: "tada", stage: 1, time: "1:05–1:45",
    say: ["第二层，找到信息。以前找一份资料要问一圈，还要确认是不是最新版。现在直接问 Tada。", "这张卡是今天在 Tada 知识库里真实检索的结果，只隐去了链接：找到 1 份正式资料，另有 2 份群里分享过的资料。追问就在同一线程里回。"],
    facts: ["2026-11-09 通过 Tada 知识库检索「北京办公室入职指南」：正式资料《北京 Office 新员工入职指南 2026》，11/5 更新；另有 2 份群里分享的资料。Slack 里的回复样式以现场为准。"],
    prompts: ["tada"] },
  { id: "tada-use", stage: 1, time: "1:45–2:20",
    say: ["三种用法：在频道里 @Tada，频道里的人都看得到；私聊 Tada，只有你看得到；连上自己的 Google Drive 后，在私聊里发 Drive: 加链接，它就能读你有权限的文件。", "提问时用文档全名，要原文链接。没回复，可能还没开通，找 Ken。"],
    facts: ["Drive 连接步骤与中英教程一致：Tada 主页 → 打开我的工作台 → Google Drive → 连接 → 选和 Slack 邮箱一致的公司账号 → 看到「已连接」→ 在私聊发 Drive: 加链接。查已发布的公司资料不需要连接 Drive。"] },
  { id: "searchable", stage: 1, time: "2:20–2:55",
    say: ["要让人和工具都找得到，信息得先放在找得到的地方。", "三条约定：日常业务讨论放公开频道；非必要不建私密群；新频道如果大家会在里面问问题，就把 Tada 加进来，并告诉 Ken 开启。"],
    facts: ["Tada 只能看到它所在频道里的消息；在群里回答时只用本群内容和公司资料，不会带入私聊或其他群的内容。"] },
  { id: "gws-setup", stage: 2, time: "2:55–3:35",
    say: ["第三层，大家直接在自己常用的 AI Agent 里说要做什么，Agent 在后台调用 Google Workspace CLI。", "贴上 Google 文档链接，用自己的话说明想要的结果。首次配置说明留在备注。"],
    facts: ["gws 需要在 AI Agent 运行的环境里安装并授权。配置可能需要 Google Cloud 项目和 OAuth 客户端，参见官方说明。"],
    prompts: ["gwsSetup"] },
  { id: "gws-review", stage: 2, time: "3:35–4:25",
    say: ["评审快开始时，把 Google 文档链接和问题交给 AI Agent。", "Agent 用 gws 读文档，整理本期和后续内容，附上来源。画面是演练示例。"],
    facts: ["Agent 读取 Google Doc 需要相应的账号访问权限和授权。示例回复仅用于说明形式。"],
    prompts: ["gwsReview"] },
  { id: "gws-agenda", stage: 2, time: "4:25–5:15",
    say: ["开会前，直接让 AI Agent 用 Google Workspace CLI 查看下一场会议和附带文档，列出两条准备事项。", "画面里的会议和准备事项是示例。没有会议文档时，让 Agent 如实说明。"],
    facts: ["Agent 需要日历和文档的读取权限。gws 支持读取日程和会议关联资料；实际结果取决于会议是否附带可访问的文档。"],
    prompts: ["gwsAgenda"] },
  { id: "close", stage: -1, time: "5:15–5:40",
    say: ["每一层先做一步：今天在日历标好工作时间；会后问 Tada 一个手头的真实问题；这周让 AI Agent 用 gws 完成一件事。", "安装说明和可复制的问法，点最后一个按钮。"] }
];
const stages = [["Find each other", "找到彼此"], ["Find information", "找到信息"], ["Use Google Workspace CLI", "使用 Google Workspace CLI"]];

const presenter = document.querySelector("#presenter");
const screen = document.querySelector("#screen");
const chapterSelect = document.querySelector("#chapters");
const notes = document.querySelector("#notes");
const prev = document.querySelector("#prev");
const next = document.querySelector("#next");
const languages = ["both", "en", "zh"];
const pad = n => String(n).padStart(2, "0");
const sceneLabel = index => document.getElementById(chapters[index].id).content.firstElementChild.dataset.label;
let current = 0;

function icon(name) {
  return `<svg class="ico" aria-hidden="true"><use href="#i-${name}"/></svg>`;
}
function promptText(key, lang) {
  const prompt = prompts[key];
  const links = prompt.chips.filter(chip => chip.slotEn).map(chip => lang === "en"
    ? `${chip.slotEn}: [paste the ${chip.linkEn}]`
    : `${chip.slotZh}：[贴 ${chip.linkZh}]`);
  return [prompt[lang], links.join("\n")].filter(Boolean).join("\n\n");
}
function renderWindows(scene) {
  const reference = scene.querySelector("[data-reference-day]");
  if (!reference) return;
  const beijingDate = new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Shanghai", year: "numeric", month: "2-digit", day: "2-digit" });
  const date = Object.fromEntries(beijingDate.formatToParts(new Date()).map(part => [part.type, part.value]));
  const dateLabel = [date.year, date.month, date.day].join("-");
  const utcMidnight = Date.UTC(Number(date.year), Number(date.month) - 1, Number(date.day));
  // Beijing is UTC+8 all year: 08:00 and 22:00 Beijing are 00:00 and 14:00 UTC.
  const windows = [[0, 2], [14, 16]];
  reference.textContent = dateLabel;
  reference.dateTime = dateLabel;
  for (const row of scene.querySelectorAll("[data-zone]")) {
    const formatter = new Intl.DateTimeFormat("en-CA", {
      timeZone: row.dataset.zone, year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hourCycle: "h23"
    });
    row.querySelectorAll("[data-window]").forEach((cell, index) => {
      const [start, end] = windows[index].map(hour => Object.fromEntries(
        formatter.formatToParts(utcMidnight + hour * 3_600_000).map(part => [part.type, part.value])));
      const startHour = Number(start.hour);
      const endHour = Number(end.hour) || 24;
      cell.textContent = `${start.hour}:${start.minute}–${end.hour}:${end.minute}`;
      cell.classList.toggle("good", startHour >= 7 && endHour <= 21 && endHour > startHour);
      if ([start.year, start.month, start.day].join("-") < dateLabel) {
        const note = document.createElement("span");
        note.className = "prev biline";
        note.innerHTML = '<span lang="en">Previous day</span><span class="cn" lang="zh-Hans">前一天</span>';
        cell.append(note);
      }
    });
  }
}

for (let index = 0; index < chapters.length; index++) {
  chapterSelect.add(new Option(`${pad(index + 1)}  ${sceneLabel(index)}`, index));
}
function show(index) {
  const chapter = chapters[index];
  if (!chapter) return;
  current = index;
  const scene = document.getElementById(chapter.id).content.firstElementChild.cloneNode(true);
  const mast = document.createElement("div");
  mast.className = "mast";
  const track = stages.map(([en, zh], step) =>
    `<li${step === chapter.stage ? ' class="on" aria-current="step"' : ""}><span class="n">${step + 1}</span><span lang="en">${en}</span><span class="cn" lang="zh-Hans">${zh}</span></li>`).join("");
  mast.innerHTML = `<ol class="track">${track}</ol><span>${pad(index + 1)} / ${pad(chapters.length)}</span>`;
  scene.prepend(mast);
  scene.querySelectorAll("[data-guide]").forEach(link => { link.href = guideUrl; });
  renderWindows(scene);
  screen.replaceChildren(scene);
  chapterSelect.value = String(index);
  prev.disabled = index === 0;
  next.disabled = index === chapters.length - 1;
}
function cycleLanguage() {
  const value = languages[(languages.indexOf(screen.dataset.language) + 1) % languages.length];
  screen.dataset.language = value;
  screen.classList.toggle("no-chinese", value === "en");
  document.documentElement.lang = value === "zh" ? "zh-Hans" : "en";
}
async function toggleFullscreen() {
  try {
    if (document.fullscreenElement) await document.exitFullscreen();
    else await presenter.requestFullscreen();
  } catch {
    document.querySelector("#full").textContent = "Use browser full screen";
  }
}
function noteSection(title, items) {
  const heading = document.createElement("h3");
  heading.textContent = title;
  const list = document.createElement("ul");
  for (const item of items) {
    const entry = document.createElement("li");
    entry.innerHTML = item;
    list.append(entry);
  }
  return [heading, list];
}
function requestBox(key, lang) {
  const box = document.createElement("div");
  box.className = "request-box";
  const label = document.createElement("label");
  label.htmlFor = `request-${key}-${lang}`;
  label.textContent = prompts[key].name + (lang === "en" ? " · English" : " · 中文");
  const field = document.createElement("textarea");
  field.id = label.htmlFor;
  field.readOnly = true;
  field.value = promptText(key, lang);
  const copy = document.createElement("button");
  copy.type = "button";
  copy.textContent = lang === "en" ? "Copy" : "复制";
  const status = document.createElement("span");
  status.setAttribute("role", "status");
  copy.addEventListener("click", () => {
    const select = () => {
      field.focus();
      field.select();
      status.textContent = "已选中，按 ⌘C 或 Ctrl+C 复制。";
    };
    if (!navigator.clipboard?.writeText) return select();
    navigator.clipboard.writeText(field.value).then(() => { status.textContent = "已复制。"; }, select);
  });
  box.append(label, field, copy, status);
  return box;
}
function promptParts(keys) {
  const heading = document.createElement("h3");
  heading.textContent = "Copy · 可复制内容";
  return [heading, ...keys.flatMap(key => [requestBox(key, "zh"), requestBox(key, "en")])];
}
function setupParts() {
  const heading = document.createElement("h3");
  heading.textContent = "Setup, once per person · 安装和登录（每人一次）";
  const list = document.createElement("ol");
  for (const step of setupSteps) {
    const entry = document.createElement("li");
    entry.innerHTML = `<strong>${step.title}</strong>` +
      (step.cmds ?? []).map(cmd => `<code class="cmd">${cmd}</code>`).join("") +
      `<p lang="en">${step.en}</p><p lang="zh-Hans">${step.zh}</p>`;
    list.append(entry);
  }
  const links = noteSection("Official guides · 官方说明", setupLinks.map(([title, url]) =>
    `<a href="${url}" target="_blank" rel="noopener noreferrer">${title}</a>`));
  return [heading, list, ...links];
}
function openSetup() {
  document.querySelector("#notes-title").textContent = "Setup and prompts · 安装和问法";
  document.querySelector("#note-content").replaceChildren(...setupParts(), ...promptParts(["tada", "gwsSetup", "gwsReview", "gwsAgenda"]));
  notes.showModal();
}
function openNotes() {
  const chapter = chapters[current];
  document.querySelector("#notes-title").textContent = `${pad(current + 1)} ${sceneLabel(current)} · ${chapter.time}`;
  const parts = [...noteSection("讲法", chapter.say)];
  if (chapter.facts) parts.push(...noteSection("依据", chapter.facts));
  if (chapter.prompts) parts.push(...promptParts(chapter.prompts));
  const timing = document.createElement("small");
  timing.textContent = "讲者备注（N）。C 切换中英 / 英文 / 中文，R 重播动画，F 全屏。";
  parts.push(timing);
  document.querySelector("#note-content").replaceChildren(...parts);
  notes.showModal();
}

prev.addEventListener("click", () => show(current - 1));
next.addEventListener("click", () => show(current + 1));
chapterSelect.addEventListener("change", () => show(Number(chapterSelect.value)));
document.querySelector("#close-notes").addEventListener("click", () => notes.close());
document.querySelector("#full").addEventListener("click", toggleFullscreen);
screen.addEventListener("click", event => {
  if (event.target.closest("[data-open-setup]")) openSetup();
});
document.addEventListener("keydown", event => {
  if (event.repeat || notes.open || event.target.closest("select, a, textarea") ||
      event.ctrlKey || event.altKey || event.metaKey) return;
  switch (event.key.toLowerCase()) {
    case "arrowright":
    case "pagedown":
      event.preventDefault();
      show(current + 1);
      break;
    case "arrowleft":
    case "pageup":
      event.preventDefault();
      show(current - 1);
      break;
    case " ":
      if (event.target.closest("button")) break;
      event.preventDefault();
      show(current + 1);
      break;
    case "f": toggleFullscreen(); break;
    case "c": cycleLanguage(); break;
    case "r": show(current); break;
    case "n": openNotes(); break;
  }
});
show(0);
</script>
</body>
