<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#FFF8E9">
<link rel="icon" href="data:,">
<title>Ask across Slack + Google Docs · AI Agent onboarding</title>
<style>
:root {
  --paper: #fff8e9;
  --warm: #ffead2;
  --orange: #ff4e00;
  --ink: #232222;
  --muted: #69605b;
  --cn: #574d48;
  --label: #96390c;
  --card: #fffdf8;
  --line: #eadbc8;
  --line-strong: #d6bc9f;
  --mark: #ffd3aa;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --ease: cubic-bezier(.2, .72, .2, 1);
  --r-lg: 1.15cqw;
  --r-md: .8cqw;
  --r-sm: .5cqw;
  --edge: max(1px, .06cqw);
  --shadow: 0 .1cqw .3cqw #6b3f1a0d, 0 .9cqw 2.4cqw #6b3f1a14;
  font-family: var(--sans);
  color: var(--ink);
  background: #f3e7d6;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; }
h1, h2, h3, p, figure, blockquote, ol, ul { margin: 0; }
ol, ul { padding: 0; list-style: none; }
button, select, textarea { font: inherit; color: inherit; }
button, select, a { touch-action: manipulation; }
button:focus-visible, select:focus-visible, a:focus-visible, textarea:focus-visible { outline: 2px solid var(--orange); outline-offset: 3px; }
.ico { width: 1em; height: 1em; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

/* Stage */
#presenter { min-height: 100dvh; display: grid; place-content: center; justify-items: center; background: #f3e7d6; }
#screen, .toolbar { width: min(100vw, calc((100dvh - 51px) * 16 / 9)); }
#screen { position: relative; container-type: inline-size; overflow: hidden; aspect-ratio: 16 / 9; background: var(--paper); }
#presenter:fullscreen #screen { width: min(100vw, calc(100dvh * 16 / 9)); }
#presenter:fullscreen .toolbar { display: none; }

.scene {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  padding: 2.9cqw 5.6cqw 2.3cqw;
  background: var(--paper);
  animation: scene-in .35s ease-out both;
}
.scene.warm { background: radial-gradient(110% 85% at 90% 105%, #ffe5c9 0%, transparent 62%), var(--paper); }
.mast { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: .92cqw; font-weight: 600; letter-spacing: .08em; }
.mast .brand { display: inline-flex; align-items: center; gap: .6cqw; }
.mast .brand::before { content: ""; width: .5cqw; aspect-ratio: 1; border-radius: 50%; background: var(--orange); }
.head { margin-top: 2.4cqw; }
.eyebrow { font-size: 1.12cqw; font-weight: 650; color: var(--label); }
.eyebrow .cn { color: #7a4a33; }
h1 { font-family: var(--serif); font-weight: 400; font-size: 3.3cqw; line-height: 1.08; margin-top: .5cqw; }
h1 .cn { color: var(--muted); font-family: var(--sans); margin-top: .28em; }
.main { flex: 1; min-height: 0; margin-top: 2.2cqw; }
.foot { margin-top: auto; padding-top: 1cqw; font-size: 1cqw; color: var(--muted); }
.foot::before { content: ""; display: inline-block; width: .4cqw; aspect-ratio: 1; margin-right: .6cqw; border-radius: 50%; background: #d9b796; vertical-align: .15cqw; }

/* Bilingual */
.cn { color: var(--cn); font-family: var(--sans); }
.no-chinese .cn { display: none !important; }
.bi > span { display: block; }
.bi > .cn { margin-top: .22em; }
.biline > .cn { margin-left: .5em; }

/* Shared pieces */
.card { background: var(--card); border: var(--edge) solid var(--line-strong); border-radius: var(--r-lg); box-shadow: var(--shadow); }
mark { color: inherit; padding: 0 .08em; border-radius: .2em; background: linear-gradient(var(--mark), var(--mark)) no-repeat 0 88% / 100% 64%; animation: mark-in .6s var(--ease) var(--md, 0s) backwards; }
.tag { margin-left: auto; padding: .2cqw .6cqw; border-radius: 999px; background: #fdebd6; color: #7d4021; font-size: .9cqw; font-weight: 600; }
.arrive { animation: arrive .6s var(--ease) var(--d, 0s) both; }
.paper-in { animation: paper-in .8s var(--ease) var(--d, 0s) both; }
@keyframes scene-in { from { opacity: 0; } }
@keyframes arrive { from { opacity: 0; transform: translateY(.8cqw); } }
@keyframes paper-in { from { opacity: 0; transform: translate(var(--from-x, 0), 1.5cqw); } }
@keyframes mark-in { from { background-size: 0% 64%; } }
@keyframes w-in { from { opacity: 0; } }

/* AI Agent box: the same composer on every scene */
.agent { display: flex; flex-direction: column; background: var(--card); border: var(--edge) solid var(--line-strong); border-radius: var(--r-lg); box-shadow: var(--shadow); overflow: hidden; }
.agent-bar { display: flex; align-items: center; gap: .6cqw; min-height: 3cqw; padding: .5cqw .8cqw .5cqw 1.3cqw; border-bottom: var(--edge) solid var(--line); background: #fff5e8; font-size: 1cqw; font-weight: 650; }
.agent-bar .tag { margin-right: .5cqw; }
.agent-tools { display: flex; gap: .5cqw; margin-left: auto; }
.agent[data-animate="full"] .agent-tools, .agent[data-animate="full"] .send { animation: arrive .5s var(--ease) var(--t-foot, 0s) both; }
.agent-mark { display: inline-block; width: 1.05cqw; aspect-ratio: 1; flex: none; border-radius: 50%; background: radial-gradient(circle at 34% 32%, #ff9a63, var(--orange) 70%); }
.agent-field { display: grid; grid-template-columns: 1fr auto; column-gap: 1.2cqw; padding: 1.15cqw 1.35cqw 1.2cqw; }
.agent-field .chips { grid-column: 1 / -1; }
.chips { display: flex; flex-wrap: wrap; gap: .6cqw; margin-bottom: .95cqw; }
.chip { display: inline-flex; align-items: center; gap: .5cqw; padding: .42cqw .75cqw .42cqw .55cqw; border: var(--edge) solid #e3c4a4; border-radius: var(--r-sm); background: #fff0de; color: #5b3824; font-size: 1cqw; font-weight: 560; white-space: nowrap; }
.chip .ico { font-size: 1.2cqw; color: var(--label); }
.chip .url { font-family: var(--mono); font-size: .82cqw; font-weight: 400; color: #8b6c59; }
.chip.is-slot { border-style: dashed; border-color: #cf9f78; background: transparent; }
.agent[data-animate] .chip { animation: chip-in .65s var(--ease) both; animation-delay: calc(.55s + var(--ci) * .38s); }
@keyframes chip-in { from { opacity: 0; transform: translate(-4cqw, -1.6cqw) scale(.94); } }
.prompt { font-family: var(--serif); font-size: 1.52cqw; line-height: 1.32; }
.prompt .w { animation: w-in .14s linear backwards; animation-delay: calc(var(--t0) + var(--i) * var(--step)); }
.slot { padding: 0 .2em; border-radius: .25em; background: #ffe5cc; color: var(--label); }
.copy { display: inline-flex; align-items: center; gap: .45cqw; padding: .4cqw .8cqw; border: var(--edge) solid var(--line-strong); border-radius: 999px; background: #fff; color: #5b3824; font-size: .95cqw; font-weight: 600; cursor: pointer; }
.copy .ico { font-size: 1.05cqw; }
.copy:hover { background: #fff0de; border-color: #c98f66; }
.copy.done { background: #fff0de; border-color: #c98f66; color: var(--label); }
.send { align-self: end; width: 2.2cqw; aspect-ratio: 1; display: grid; place-items: center; border-radius: 50%; background: var(--orange); color: #fff; font-size: 1.15cqw; }
.send .ico { stroke-width: 2.2; }

/* 01 Opening */
.open-grid { display: grid; grid-template-columns: 1fr 39cqw; gap: 4.5cqw; align-items: center; margin-top: 0; }
.s-open h1 { font-size: 4.2cqw; line-height: 1.04; margin-top: .9cqw; }
.where { margin-top: 3cqw; }
.where-label { font-size: 1.12cqw; font-weight: 650; color: var(--label); }
.where-row { display: flex; align-items: center; gap: .9cqw; margin-top: .9cqw; }
.src-tile { display: flex; align-items: center; gap: .8cqw; padding: .85cqw 1.1cqw; border: var(--edge) solid var(--line-strong); border-radius: var(--r-md); background: var(--card); font-size: 1.32cqw; line-height: 1.2; }
.src-tile > .ico { font-size: 1.9cqw; color: var(--label); }
.where-plus { font-family: var(--serif); font-size: 2cqw; color: #b48663; }
.chat { overflow: hidden; }
.chat-bar { display: flex; align-items: center; gap: .6cqw; padding: .75cqw 1.3cqw; border-bottom: var(--edge) solid var(--line); background: #fff5e8; font-size: 1cqw; font-weight: 650; color: #6a4630; }
.chat-bar .tag { font-size: .88cqw; }
.msg { display: grid; grid-template-columns: 3cqw 1fr; gap: 1.1cqw; padding: 1.5cqw 1.5cqw 1.8cqw; }
.avatar { width: 3cqw; aspect-ratio: 1; display: grid; place-items: center; border-radius: 26%; background: #f6c9a2; color: #6b3417; font-family: var(--serif); font-size: 1.45cqw; }
.msg-who { display: flex; align-items: baseline; gap: .7cqw; font-size: 1.05cqw; color: var(--muted); }
.msg-who b { color: var(--ink); font-size: 1.15cqw; }
.msg-who time { margin-left: auto; font-size: .95cqw; }
.dots { display: flex; gap: .35cqw; max-height: 0; opacity: 0; overflow: hidden; animation: dots 1.5s linear .95s both; }
.dots i { width: .6cqw; aspect-ratio: 1; border-radius: 50%; background: #d2b193; animation: dot .9s ease-in-out infinite; }
.dots i:nth-child(2) { animation-delay: .15s; }
.dots i:nth-child(3) { animation-delay: .3s; }
@keyframes dots { 0% { max-height: 2cqw; margin-top: .9cqw; opacity: 0; } 12%, 82% { max-height: 2cqw; margin-top: .9cqw; opacity: 1; } 100% { max-height: 0; margin-top: 0; opacity: 0; } }
@keyframes dot { 50% { transform: translateY(-.3cqw); } }
.msg-text { margin-top: .7cqw; font-size: 2cqw; line-height: 1.24; }
.msg-text > span:first-child { font-family: var(--serif); }

/* 02 Usual way */
.s-usual .main { display: flex; flex-direction: column; justify-content: center; padding-bottom: 2.5cqw; }
.steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1.6cqw; }
.step { display: flex; flex-direction: column; gap: 1.05cqw; animation: arrive .6s var(--ease) var(--d) both; }
.mini { position: relative; height: 15.6cqw; overflow: hidden; border: var(--edge) solid var(--line-strong); border-radius: var(--r-md); background: var(--card); box-shadow: var(--shadow); font-size: .92cqw; }
.mini-bar { position: relative; z-index: 1; display: flex; align-items: center; gap: .45cqw; height: 2cqw; padding: 0 .8cqw; border-bottom: var(--edge) solid var(--line); background: #fff5e8; color: #6a4630; font-weight: 600; white-space: nowrap; }
.mini-bar .ico { font-size: 1.05cqw; color: var(--label); }
.feed { padding: .8cqw; animation: feed 1.3s var(--ease) calc(var(--d) + .45s) both; }
@keyframes feed { from { transform: translateY(0); } to { transform: translateY(-4.6cqw); } }
.row { display: flex; align-items: center; gap: .55cqw; height: 1.9cqw; }
.row i { width: 1.15cqw; aspect-ratio: 1; flex: none; border-radius: 30%; background: #f2dcc6; }
.row b { width: var(--w); height: .55cqw; border-radius: 99px; background: #ecdcca; }
.row span { font-weight: 600; white-space: nowrap; }
.page { display: grid; gap: .75cqw; padding: 1cqw .9cqw; }
.page b { width: var(--w); height: .55cqw; border-radius: 99px; background: #ecdcca; }
.page b.h { height: .85cqw; background: #e1c8ae; }
.page p { font-weight: 600; }
.cmp { width: 100%; border-collapse: collapse; margin-top: .4cqw; }
.cmp th, .cmp td { padding: .55cqw .7cqw; text-align: left; font-weight: 500; white-space: nowrap; }
.cmp thead th { color: var(--muted); font-weight: 600; }
.cmp tbody tr { border-top: var(--edge) solid var(--line); }
.cmp tbody th { color: var(--label); font-weight: 650; }
.draft { margin: 1cqw .9cqw; padding: .8cqw; min-height: 6cqw; border: var(--edge) solid var(--line); border-radius: var(--r-sm); background: #fff; font-family: var(--mono); font-size: .88cqw; }
.draft-text { display: inline-block; width: 27ch; overflow: hidden; white-space: nowrap; vertical-align: bottom; animation: draft 1.1s steps(27) 2.45s backwards; }
@keyframes draft { from { width: 0; } }
.caret { display: inline-block; width: .13cqw; height: 1.1cqw; margin-left: .1cqw; vertical-align: -.2cqw; background: var(--ink); animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.step-text { display: grid; grid-template-columns: 1.9cqw 1fr; gap: .7cqw; align-items: start; font-size: 1.32cqw; line-height: 1.22; }
.step-text .n { width: 1.9cqw; aspect-ratio: 1; display: grid; place-items: center; border-radius: 50%; background: var(--warm); color: var(--label); font-size: 1cqw; font-weight: 700; }
.verbs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1.6cqw; margin-top: 2.1cqw; }
.verb { position: relative; padding-top: .9cqw; font-family: var(--serif); font-size: 1.9cqw; animation: arrive .5s var(--ease) var(--d) both; }
.verb .cn { font-size: 1.9cqw; }
.verb::before { content: ""; position: absolute; inset: 0 0 auto; height: .2cqw; border-radius: 99px; background: var(--orange); transform-origin: left; animation: line-in .6s var(--ease) var(--d) both; }
.verb.find { grid-column: 1 / span 2; }
@keyframes line-in { from { transform: scaleX(0); } }

/* 03 Ask */
.ask-grid { display: grid; grid-template-columns: 1fr 24.5cqw; gap: 3.2cqw; align-items: center; }
.readers { display: grid; gap: 1.25cqw; }
.reader { display: grid; grid-template-columns: 8.6cqw 1fr; gap: 1cqw; align-items: baseline; padding-bottom: 1.25cqw; border-bottom: var(--edge) solid var(--line); font-size: 1.38cqw; line-height: 1.22; }
.reader:last-child { border-bottom: 0; padding-bottom: 0; }
.tool { display: inline-flex; align-items: center; gap: .5cqw; color: var(--label); font-family: var(--mono); font-size: 1.42cqw; font-weight: 700; }
.tool .ico { font-size: 1.4cqw; }
.reader.is-agent .tool { font-family: var(--sans); font-size: 1.2cqw; color: var(--ink); }
.s-ask .prompt { font-size: 1.66cqw; }

/* 04 Get */
.get-grid { display: grid; grid-template-columns: 31cqw 1fr; gap: 2.3cqw; align-items: start; }
.src-col { display: grid; gap: 1cqw; }
.src-card { padding: 1cqw 1.25cqw 1.15cqw; transition: border-color .2s ease, box-shadow .2s ease; }
.src-card.is-checked { border-color: #e0733a; box-shadow: 0 0 0 .22cqw #ff4e0029, var(--shadow); }
.src-head { display: flex; align-items: center; gap: .5cqw; font-size: 1cqw; font-weight: 650; color: #6a4630; }
.src-head .ico { font-size: 1.2cqw; color: var(--label); }
.src-card > .bi { margin-top: .65cqw; font-size: 1.36cqw; line-height: 1.28; }
.reply { animation: unfold .8s var(--ease) var(--d) backwards; }
@keyframes unfold { from { opacity: 0; transform: translateY(.6cqw); clip-path: inset(0 0 100% 0 round var(--r-lg)); } to { clip-path: inset(0 0 0 0 round var(--r-lg)); } }
.you { padding: .7cqw 1.35cqw; border-bottom: var(--edge) solid var(--line); color: var(--muted); font-size: .98cqw; }
.reply-body { padding: 1.1cqw 1.35cqw 1.25cqw; }
.reply blockquote { margin-top: .55cqw; font-size: 1.95cqw; line-height: 1.24; }
.reply blockquote > span:first-child { font-family: var(--serif); }
.src-row { display: flex; flex-wrap: wrap; align-items: center; gap: .6cqw; margin-top: 1.1cqw; padding-top: .95cqw; border-top: var(--edge) solid var(--line); }
.src-row-label { margin-right: .3cqw; color: var(--muted); font-size: .98cqw; font-weight: 600; }
.src-btn { display: inline-flex; align-items: center; gap: .45cqw; padding: .4cqw .75cqw; border: var(--edge) solid #e3c4a4; border-radius: var(--r-sm); background: #fff0de; color: #5b3824; font-size: .98cqw; font-weight: 600; cursor: pointer; }
.src-btn .ico { font-size: 1.1cqw; color: var(--label); }
.src-btn:hover, .src-btn[aria-pressed="true"] { border-color: #d0743f; background: #ffe5cc; }
.saved { display: grid; grid-template-columns: 1.2fr 1fr; gap: 2.3cqw; margin-top: 1.9cqw; padding-top: 1.2cqw; border-top: var(--edge) solid var(--line-strong); }
.saved-k { display: block; margin-bottom: .45cqw; color: var(--label); font-size: 1cqw; font-weight: 650; }
.done-list { display: flex; flex-wrap: wrap; gap: 1.5cqw; font-family: var(--serif); font-size: 1.6cqw; }
.done-list > span { display: inline-flex; align-items: center; gap: .4cqw; }
.done-list .ico { font-size: 1.3cqw; color: var(--orange); stroke-width: 2.4; }
.done-list .cn { font-size: 1.6cqw; margin-left: .35em; }
.still { font-size: 1.6cqw; font-family: var(--serif); }
.still .cn { font-size: 1.6cqw; }

/* 05 A/B */
.ab-grid { display: grid; grid-template-columns: 1fr 1.28fr; gap: 1.8cqw; }
.ab-card { display: grid; grid-template-columns: 2.1cqw 1fr; gap: .8cqw 1.1cqw; align-content: start; padding: 1.25cqw 1.4cqw 1.35cqw; text-align: left; cursor: pointer; transition: border-color .18s ease, box-shadow .18s ease, background .18s ease; }
.ab-card:hover { border-color: #c98f66; background: #fffaf3; }
.ab-card[aria-pressed="true"] { border-color: #d0743f; background: #fffaf3; box-shadow: 0 0 0 .22cqw #ff4e0026, var(--shadow); }
.ab-id { width: 2.1cqw; aspect-ratio: 1; flex: none; display: grid; place-items: center; border-radius: 50%; background: var(--warm); color: var(--label); font-size: 1.05cqw; font-weight: 750; }
.ab-card[aria-pressed="true"] .ab-id { background: var(--orange); color: #fff; }
.ab-card > .ab-id { grid-row: 1 / span 2; }
.ab-card > :not(.ab-id) { grid-column: 2; }
.ab-text { font-size: 1.5cqw; line-height: 1.3; }
.ab-text > span:first-child { font-family: var(--serif); }
.ab-card .chips { margin: 0; }
.ab-card .chip .url { display: none; }
.seg { background: linear-gradient(#e0733a, #e0733a) no-repeat 0 100% / 0 .16cqw; transition: background-size .6s var(--ease); }
.seg::before { content: attr(data-n); display: none; width: 1.25cqw; height: 1.25cqw; margin-right: .3em; border-radius: 50%; background: var(--orange); color: #fff; font-family: var(--sans); font-size: .78cqw; font-weight: 700; line-height: 1.25cqw; text-align: center; vertical-align: .15cqw; }
.ab-grid[data-picked="b"] [data-choice="b"] .seg { background-size: 100% .16cqw; }
.ab-grid[data-picked="b"] [data-choice="b"] .seg::before { display: inline-block; }
.ab-out { margin-top: 1.7cqw; }
.ab-hint { padding-top: 1.1cqw; border-top: var(--edge) solid var(--line-strong); font-size: 1.5cqw; color: var(--muted); }
.out { display: grid; grid-template-columns: 1.75fr 1fr; gap: 2cqw; align-items: center; animation: arrive .45s var(--ease) both; }
.out-card { padding: 1.05cqw 1.35cqw 1.2cqw; }
.out-label { display: flex; align-items: center; gap: .6cqw; font-size: 1.05cqw; font-weight: 650; color: var(--label); }
.out-label .ab-id { width: 1.7cqw; font-size: .88cqw; background: var(--orange); color: #fff; }
.out-text { margin-top: .6cqw; font-size: 1.45cqw; line-height: 1.26; }
.out-text > span:first-child { font-family: var(--serif); }
.out-card .src-row { margin-top: .8cqw; padding-top: .75cqw; }
.out-next { font-size: 1.45cqw; line-height: 1.28; }
.out-next .k { display: block; margin-bottom: .4cqw; color: var(--label); font-size: 1.05cqw; font-weight: 650; }
.recipe { display: grid; gap: .55cqw; }
.recipe li { display: grid; grid-template-columns: 1.6cqw 1fr; gap: .6cqw; align-items: baseline; font-size: 1.35cqw; }
.recipe .n { width: 1.5cqw; aspect-ratio: 1; display: grid; place-items: center; border-radius: 50%; background: var(--orange); color: #fff; font-size: .85cqw; font-weight: 700; transform: translateY(-.1cqw); }
.recipe .bi > .cn { margin-top: 0; }

/* 06 Teams */
.team-grid { display: grid; grid-template-columns: 26.5cqw 1fr; gap: 2.4cqw; }
.team-list { display: grid; gap: .65cqw; align-content: start; }
.team-tab { position: relative; padding: .8cqw 1.1cqw .9cqw 1.4cqw; border: var(--edge) solid transparent; border-radius: var(--r-md); background: transparent; text-align: left; cursor: pointer; transition: background .18s ease, border-color .18s ease; }

.out-rows { margin-top: .35cqw; }

.out-rows li:first-child { border-top: 0; }

/* 07 Decide */

.link-btn { margin-left: .6cqw; padding: .3cqw .75cqw; border: var(--edge) solid #c98f66; border-radius: 999px; background: #ffe5cc; color: #6b3417; font-size: .98cqw; font-weight: 650; cursor: pointer; }
.link-btn:hover { background: #ffd8b4; }

/* Toolbar and notes */
.toolbar { min-height: 49px; display: flex; gap: 6px; padding: 7px 10px; align-items: center; font-size: 12px; color: #61483a; }
.toolbar button, .toolbar select { border: 1px solid #c7ae93; border-radius: 6px; background: #fff8ed; color: #65432c; padding: 5px 9px; cursor: pointer; }
.toolbar button:hover, .toolbar select:hover { background: #ffe6cc; }

.toolbar .push { flex: 1; }

#notes { max-height: 86vh; width: min(720px, 92vw); padding: 24px 26px; border: 1px solid #9e8165; border-radius: 14px; background: var(--paper); color: var(--ink); font-size: 15px; }
#notes::backdrop { background: #1b1512ba; }
#notes header { display: flex; justify-content: space-between; gap: 16px; align-items: center; }
#notes h2 { font-family: var(--serif); font-weight: 400; font-size: 23px; }
#notes h3 { margin-top: 18px; font-size: 14px; color: #7d310e; }
#notes p, #notes li { line-height: 1.6; }
#notes p { margin-top: 8px; }
#notes ul, #notes ol { margin-top: 6px; padding-left: 20px; }
#notes ul { list-style: disc; }
#notes ol { list-style: decimal; }

#notes small { display: block; margin-top: 18px; color: var(--muted); }
#notes button { padding: 6px 10px; border: 1px solid var(--line-strong); border-radius: 6px; background: #ffe8cf; cursor: pointer; }
.request-box { margin-top: 10px; padding: 12px; border: 1px solid var(--line-strong); border-radius: 8px; background: #fff2df; }
.request-box label { display: block; font-size: 13px; font-weight: 650; color: #753610; }
.request-box textarea { display: block; width: 100%; min-height: 122px; margin: 8px 0; padding: 8px; border: 1px solid var(--line-strong); border-radius: 5px; background: #fffaf1; font-size: 13px; line-height: 1.5; resize: vertical; }

@media (max-width: 720px) {

    say: ["先让大家选，再两个都点一下。", "A 只给背景，你还得追问「这一版到底在哪看」。B 说清了三件事：谁在问什么、读哪里、要什么结果，所以直接拿到能发的话。"],
    facts: ["A 和 B 下方的结果都是演练示例，用来对比问法，不是 AI 的真实输出记录。"],
    requests: ["review"]
  },
  {
    id: "team", time: "2:00–3:20",
    say: ["同一个版本，四种活。点到哪个部门，就看那一格：贴什么、怎么问、拿到什么。", "增长那格说明工具能帮到哪一步：slack 帮你找到之前的讨论和负责人，开权限要负责人来做。"],
    facts: [
      "口径：讲者的 Slack 账号能看到的公开频道和已加入的私有频道，2026-10-01 至 2026-11-09；不含私信、群私信，以及机器人、告警和测试频道。用 66 个中英文关键词检索，再逐条人工判断。同一话题串只算一次，同一人对同一件事的追问合并。",
      "「经常有人问」指至少 3 个独立话题、至少 2 位同事提出；「有人问过」指 1–2 个话题。关键词检索会漏，也没有纳入飞书历史，所以这里不说「最高频」。",
      "产品｜经常有人问：确认某个页面或场景现在的规则、文案，或问介绍是不是最新。6 个话题，5 位同事，3 个频道（11/5–11/9）。",
      "增长｜经常有人问：数据看板和工具权限。6 件事，5 位同事（10/27–11/6），其中看板相关 3 件。邮箱迁移后看板登录问题集中出现，负责人随后统一说明了处理方式。",
      "内容｜经常出现的工作：审阅意见发在群里，需要对回文档。4 个话题，3 位审阅者（11/4–11/8）。「哪几句要改」这句原话没有检索到，按工作场景归类。",
      "研发｜有人问过：关联工单要不要一起测。1 个话题。测试清单按交接加规格的常见工作设计。",
      "页面上的人名（Mia、Dana）、文案和链接都是虚构的演练内容，不是真实摘录。"
    ],
    requests: ["eng", "content", "growth"]
  },
  {
    id: "decide", time: "3:20–4:00",
    say: ["三个简单判断。知道要找哪条消息，直接在 Slack 搜。要开权限，找负责人；slack 可以帮你找到是谁。", "要把讨论和文档合起来，才能回答或交付一件事，再打开 AI Agent。"]
  },
  {
    id: "close", time: "4:00–5:00",
    say: ["挑一个你这周要回的问题。把方括号换成你的内容，贴上两条链接。发出前，点开来源核对。"],
    tips: ["第一次用，可以在问法末尾加一句：「只读取，不要替我发消息。」"],
    requests: ["template"], setup: true
  }
];

const presenter = document.querySelector("#presenter");
const screen = document.querySelector("#screen");
const chapterSelect = document.querySelector("#chapters");
const notes = document.querySelector("#notes");
const language = document.querySelector("#language");
const prev = document.querySelector("#prev");
const next = document.querySelector("#next");
const pad = n => String(n).padStart(2, "0");
const sceneLabel = index => document.getElementById(chapters[index].id).content.firstElementChild.dataset.label;
let current = 0;

function icon(name) {
  return `<svg class="ico" aria-hidden="true"><use href="#i-${name}"/></svg>`;
}
function chipsHTML(key) {
  return prompts[key].chips.map((chip, index) =>
    `<span class="chip${chip.slot ? " is-slot" : ""}" style="--ci:${index}">${icon(chip.icon)}` +
    `<span class="biline">${chip.en} <span class="cn" lang="zh-Hans">${chip.zh}</span></span>` +
    (chip.url ? `<span class="url">${chip.url}</span>` : "") + "</span>").join("");
}
function words(text, lang, animate) {
  const pattern = lang === "en" ? /\[[^\]]+\]|\s+|[^\s[]+/g : /\[[^\]]+\]|[A-Za-z]+|\s+|[^\s[A-Za-z]{1,2}/g;
  const tokens = text.match(pattern);
  const visible = tokens.filter(token => token.trim()).length;
  let index = 0;
  const html = tokens.map(token => {
    if (!token.trim()) return token;
    const slot = token.startsWith("[");
    const classes = [animate && "w", slot && "slot"].filter(Boolean).join(" ");
    const body = slot ? token.slice(1, -1) : token;
    return classes ? `<span class="${classes}" style="--i:${index++}">${body}</span>` : body;
  }).join("");
  return { html, step: 1300 / visible };
}
function renderAgent(host) {
  const key = host.dataset.agent;
  const prompt = prompts[key];
  const typing = host.dataset.animate === "full";
  const en = words(prompt.en, "en", typing);
  const zh = words(prompt.zh, "zh", typing);
  host.classList.add("agent");
  host.style.setProperty("--t-foot", "2.75s");
  host.innerHTML =
    `<div class="agent-bar"><span class="agent-mark" aria-hidden="true"></span>AI Agent<span class="agent-tools">` +
    `<button type="button" class="copy" data-copy="${key}" data-lang="en">${icon("copy")}<span>Copy prompt</span></button>` +
    `<button type="button" class="copy cn" lang="zh-Hans" data-copy="${key}" data-lang="zh">${icon("copy")}<span>复制中文问法</span></button>` +
    `</span></div>` +
    `<div class="agent-field"><div class="chips">${chipsHTML(key)}</div>` +
    `<p class="prompt bi" style="--t0:1.3s"><span lang="en" style="--step:${en.step}ms">${en.html}</span>` +
    `<span class="cn" lang="zh-Hans" style="--step:${zh.step}ms">${zh.html}</span></p>` +
    `<span class="send" aria-hidden="true">${icon("send")}</span></div>`;
}
function renderSegments(host) {
  const segments = prompts[host.dataset.segments].segments;
  const line = column => segments.map(([en, zh], index) =>
    `<span class="seg" data-n="${index + 1}">${column === 0 ? en : zh}</span>`).join(column === 0 ? " " : "");
  host.innerHTML = `<span lang="en">${line(0)}</span><span class="cn" lang="zh-Hans">${line(1)}</span>`;
}
function promptText(key, lang) {
  const prompt = prompts[key];
  const links = prompt.chips.filter(chip => chip.slotEn).map(chip => lang === "en"
    ? `${chip.slotEn}: [paste the ${chip.linkEn}]`
    : `${chip.slotZh}：[贴 ${chip.linkZh}]`);
  return [prompt[lang], links.join("\n")].filter(Boolean).join("\n\n");
}

for (let index = 0; index < chapters.length; index++) {
  const option = document.createElement("option");
  option.value = index;
  option.textContent = pad(index + 1) + "  " + sceneLabel(index);
  chapterSelect.append(option);
}
function show(index) {
  if (index < 0 || index >= chapters.length) return;
  current = index;
  const scene = document.getElementById(chapters[index].id).content.firstElementChild.cloneNode(true);
  const mast = document.createElement("div");
  mast.className = "mast";
  mast.innerHTML = `<span class="brand">AI Agent · slack · gws</span><span>${pad(index + 1)} / ${pad(chapters.length)}</span>`;
  scene.prepend(mast);
  scene.querySelectorAll("[data-agent]").forEach(renderAgent);
  scene.querySelectorAll("[data-chips]").forEach(host => { host.innerHTML = chipsHTML(host.dataset.chips); });
  scene.querySelectorAll("[data-segments]").forEach(renderSegments);
  screen.replaceChildren(scene);
  chapterSelect.value = String(index);
  prev.disabled = index === 0;
  next.disabled = index === chapters.length - 1;
}
function toggleLanguage() {
  const englishOnly = screen.classList.toggle("no-chinese");
  language.setAttribute("aria-pressed", String(!englishOnly));
  language.textContent = englishOnly ? "English only" : "EN + 中文";
}
async function toggleFullscreen() {
  try {
    if (document.fullscreenElement) await document.exitFullscreen();
    else await presenter.requestFullscreen();
  } catch {
    document.querySelector("#full").textContent = "Use browser full screen";
  }
}
function noteSection(title, items, tag = "ul") {
  const heading = document.createElement("h3");
  heading.textContent = title;
  const list = document.createElement(tag);
  for (const item of items) {
    const entry = document.createElement("li");
    entry.innerHTML = item;
    list.append(entry);
  }
  return [heading, list];
}
function requestBox(key, lang) {
  const box = document.createElement("div");
  box.className = "request-box";
  const label = document.createElement("label");
  label.htmlFor = `request-${key}-${lang}`;
  label.textContent = prompts[key].name + (lang === "en" ? " · English" : " · 中文");
  const field = document.createElement("textarea");
  field.id = label.htmlFor;
  field.readOnly = true;
  field.value = promptText(key, lang);
  const copy = document.createElement("button");
  copy.type = "button";
  copy.textContent = lang === "en" ? "Copy" : "复制";
  const status = document.createElement("span");
  status.setAttribute("role", "status");
  copy.addEventListener("click", () => {
    const select = () => {
      field.focus();
      field.select();
      status.textContent = "已选中，按 ⌘C 或 Ctrl+C 复制。";
    };
    if (!navigator.clipboard?.writeText) return select();
    navigator.clipboard.writeText(field.value).then(() => { status.textContent = "已复制。"; }, select);
  });
  box.append(label, field, copy, status);
  return box;
}
function openNotes(focus) {
  const chapter = chapters[current];
  document.querySelector("#notes-title").textContent = `${pad(current + 1)} ${sceneLabel(current)} · ${chapter.time}`;
  const content = document.querySelector("#note-content");
  const parts = [...noteSection("讲法", chapter.say)];
  if (chapter.tips) parts.push(...noteSection("操作提示", chapter.tips));
  if (chapter.facts) parts.push(...noteSection("依据和口径", chapter.facts));
  const keys = [...new Set([...(chapter.requests ?? []), ...(focus?.key ? [focus.key] : [])])];
  if (keys.length) {
    const heading = document.createElement("h3");
    heading.textContent = "可复制的问法";
    parts.push(heading, ...keys.flatMap(key => [requestBox(key, "zh"), requestBox(key, "en")]));
  }
  if (chapter.setup || focus?.setup) {
    parts.push(...noteSection("第一次用：安装和登录（每人一次）", setupSteps, "ol"));
    parts.push(...noteSection("官方说明", setupLinks.map(([title, url]) =>
      `<a href="${url}" target="_blank" rel="noopener noreferrer">${title}</a>`)));
  }
  const timing = document.createElement("small");
  timing.textContent = "讲者备注。每幕动画播完后停住，按 → 进入下一幕。";
  parts.push(timing);
  content.replaceChildren(...parts);
  notes.showModal();
  if (focus?.key) {
    const field = document.getElementById(`request-${focus.key}-${focus.lang}`);
    field.focus();
    field.select();
    field.closest(".request-box").querySelector("[role=status]").textContent = "已选中，按 ⌘C 或 Ctrl+C 复制。";
  }
}
function copyPrompt(button) {
  const { copy: key, lang } = button.dataset;
  const fallback = () => openNotes({ key, lang });
  if (!navigator.clipboard?.writeText) return fallback();
  navigator.clipboard.writeText(promptText(key, lang)).then(() => {
    const label = button.querySelector("span");
    const original = label.textContent;
    label.textContent = lang === "en" ? "Copied" : "已复制";
    button.classList.add("done");
    setTimeout(() => {
      label.textContent = original;
      button.classList.remove("done");
    }, 1600);
  }, fallback);
}

prev.addEventListener("click", () => show(current - 1));
next.addEventListener("click", () => show(current + 1));
chapterSelect.addEventListener("change", () => show(Number(chapterSelect.value)));
language.addEventListener("click", toggleLanguage);
document.querySelector("#replay").addEventListener("click", () => show(current));
document.querySelector("#show-notes").addEventListener("click", () => openNotes());
document.querySelector("#close-notes").addEventListener("click", () => notes.close());
document.querySelector("#full").addEventListener("click", toggleFullscreen);
screen.addEventListener("click", event => {
  const target = event.target;
  const copy = target.closest("[data-copy]");
  if (copy) return copyPrompt(copy);
  if (target.closest("[data-open-notes]")) return openNotes({ setup: true });
  const check = target.closest("[data-check]");
  if (check) {
    const card = screen.querySelector(`.src-card[data-src="${check.dataset.check}"]`);
    const on = check.getAttribute("aria-pressed") !== "true";
    check.setAttribute("aria-pressed", String(on));
    card.classList.toggle("is-checked", on);
    return;
  }
  const choice = target.closest("[data-choice]");
  if (choice) {
    for (const option of screen.querySelectorAll("[data-choice]")) option.setAttribute("aria-pressed", String(option === choice));
    for (const outcome of screen.querySelectorAll("[data-outcome]")) outcome.hidden = outcome.dataset.outcome !== choice.dataset.choice;
    choice.parentElement.dataset.picked = choice.dataset.choice;
    return;
  }
  const team = target.closest("[data-team]");
  if (team) {
    for (const tab of screen.querySelectorAll("[data-team]")) {
      const on = tab === team;
      tab.setAttribute("aria-selected", String(on));
      document.getElementById(tab.getAttribute("aria-controls")).hidden = !on;
    }
  }
});
document.addEventListener("keydown", event => {
  if (event.repeat || notes.open || event.target.closest("select, a, textarea") ||
      event.ctrlKey || event.altKey || event.metaKey) return;
  switch (event.key.toLowerCase()) {
    case "arrowright":
    case "pagedown":
      event.preventDefault();
      show(current + 1);
      break;
    case "arrowleft":
    case "pageup":
      event.preventDefault();
      show(current - 1);
      break;
    case " ":
      if (event.target.closest("button")) break;
      event.preventDefault();
      show(current + 1);
      break;
    case "f": toggleFullscreen(); break;
    case "c": toggleLanguage(); break;
    case "r": show(current); break;
    case "n": openNotes(); break;
  }
});
show(0);
</script>
</body>
</html>
