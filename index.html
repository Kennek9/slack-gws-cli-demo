<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#FFF8E9">
<link rel="icon" href="data:,">
<title>Meet Tada</title>
<style>
:root {
  --paper: #fff8e9;
  --warm: #ffead2;
  --orange: #ff4e00;
  --ink: #232222;
  --muted: #69605b;
  --cn: #574d48;
  --label: #96390c;
  --card: #fffdf8;
  --line: #eadbc8;
  --line-strong: #d6bc9f;
  --mark: #ffd3aa;
  --good: #ffe1c4;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  --ease: cubic-bezier(.2, .72, .2, 1);
  --r-lg: 1.15cqw;
  --r-md: .8cqw;
  --r-sm: .5cqw;
  --edge: max(1px, .06cqw);
  --shadow: 0 .1cqw .3cqw #6b3f1a0d, 0 .9cqw 2.4cqw #6b3f1a14;
  font-family: var(--font);
  color: var(--ink);
  background: #f3e7d6;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; }
h1, h2, h3, p, figure, blockquote, ol, ul, table { margin: 0; }
ol, ul { padding: 0; list-style: none; }
button, select { font: inherit; color: inherit; }
button, select, a { touch-action: manipulation; }
button:focus-visible, select:focus-visible, a:focus-visible { outline: 2px solid var(--orange); outline-offset: 3px; }
.ico { width: 1em; height: 1em; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

/* Stage */
#presenter { min-height: 100dvh; display: grid; place-content: center; justify-items: center; background: #f3e7d6; }
#screen, .toolbar { width: min(100vw, calc((100dvh - 51px) * 16 / 9)); }
#screen { position: relative; container-type: inline-size; overflow: hidden; aspect-ratio: 16 / 9; background: var(--paper); }
#presenter:fullscreen #screen { width: min(100vw, calc(100dvh * 16 / 9)); }
#presenter:fullscreen .toolbar { display: none; }
.scene { position: absolute; inset: 0; display: flex; flex-direction: column; padding: 2.9cqw 5.6cqw 2.3cqw; background: var(--paper); animation: scene-in .35s ease-out both; }
.scene.warm { background: radial-gradient(110% 85% at 90% 105%, #ffe5c9 0%, transparent 62%), var(--paper); }
.mast { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: .92cqw; font-weight: 600; letter-spacing: .06em; }
.track { display: flex; gap: 2.1cqw; }
.track li { display: inline-flex; align-items: center; gap: .45em; color: #ab9d93; }
.track .n { display: inline-grid; place-items: center; width: 1.45cqw; aspect-ratio: 1; border-radius: 50%; background: #efe2d3; color: #8f7f74; font-size: .78cqw; letter-spacing: 0; }
.track li.on { color: var(--ink); }
.track li.on .n { background: var(--orange); color: #fff; }
.track .cn { color: inherit; letter-spacing: .02em; }
.head { margin-top: 2.4cqw; }
.eyebrow { font-size: 1.12cqw; font-weight: 650; color: var(--label); }
.eyebrow .cn { color: #7a4a33; }
.case-head h1 { margin-top: .7cqw; }
h1 { font-weight: 400; font-size: 3.2cqw; line-height: 1.08; }
h1 .cn { color: var(--muted); margin-top: .28em; }
.main { flex: 1; min-height: 0; margin-top: 2.8cqw; }
.foot { margin-top: auto; padding-top: 1cqw; font-size: 1cqw; color: var(--muted); }
.foot::before { content: ""; display: inline-block; width: .4cqw; aspect-ratio: 1; margin-right: .6cqw; border-radius: 50%; background: #d9b796; vertical-align: .15cqw; }
.foot a { color: var(--label); font-weight: 600; }

/* Bilingual: both, English only, Chinese only */
.cn { color: var(--cn); }
.bi > span { display: block; }
.bi > .cn { margin-top: .5em; }
.biline > .cn { margin-left: .9em; }
.no-chinese .cn { display: none !important; }
#screen[data-language="zh"] [lang="en"] { display: none !important; }
#screen[data-language="zh"] [lang="en"].heading-en,
#screen[data-language="zh"] [lang="en"].always-en { display: revert !important; }
#screen[data-language="zh"] .bi > .cn, #screen[data-language="zh"] .biline > .cn { margin: 0; }

/* Shared pieces */
.card { background: var(--card); border: var(--edge) solid var(--line-strong); border-radius: var(--r-lg); box-shadow: var(--shadow); }
.tag { display: inline-flex; align-items: center; gap: .4em; margin-left: auto; padding: .2cqw .6cqw; border-radius: 999px; background: #fdebd6; color: #7d4021; font-size: .88cqw; font-weight: 600; white-space: nowrap; }
.tag .cn { color: inherit; }
mark { color: inherit; padding: 0 .08em; border-radius: .2em; background: linear-gradient(var(--mark), var(--mark)) no-repeat 0 88% / 100% 64%; animation: mark-in .6s var(--ease) var(--md, 0s) backwards; }
code { font-family: inherit; font-size: .92em; padding: .05em .35em; border-radius: .3em; background: #fbe6cf; color: #6b3012; }
.arrive { animation: arrive .6s var(--ease) var(--d, 0s) both; }
.paper-in { animation: paper-in .8s var(--ease) var(--d, 0s) both; }
.unfold { animation: unfold .8s var(--ease) var(--d, 0s) backwards; }
@keyframes scene-in { from { opacity: 0; } }
@keyframes arrive { from { opacity: 0; transform: translateY(.8cqw); } }
@keyframes paper-in { from { opacity: 0; transform: translateY(1.5cqw); } }
@keyframes unfold { from { opacity: 0; transform: translateY(.6cqw); clip-path: inset(0 0 100% 0); } to { clip-path: inset(0); } }
@keyframes mark-in { from { background-size: 0% 64%; } }
@keyframes w-in { from { opacity: 0; } }
@keyframes rise { from { opacity: 0; transform: translateY(2cqw) scaleY(.9); } }

/* Before / After */
.ba-k { display: flex; align-items: center; gap: .5em; margin-bottom: .7cqw; font-size: 1cqw; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.ba-k .cn { text-transform: none; letter-spacing: 0; color: inherit; }
.ba-k .tag { text-transform: none; letter-spacing: 0; }
.after-k { color: var(--label); }
.after-col { display: grid; gap: 1.1cqw; }
.also { margin-top: 1.2cqw; display: flex; flex-wrap: wrap; align-items: center; gap: .6cqw; font-size: 1cqw; }
.also .k { color: var(--label); font-weight: 650; margin-right: .2cqw; }
.also .pill { padding: .3cqw .75cqw; border: var(--edge) solid var(--line-strong); border-radius: 999px; background: var(--card); }

/* Opening */
.s-open h1 { font-size: 4cqw; }
.opening-stage { display: flex; align-items: center; }
.opening-card { width: 100%; padding: 3cqw; }
.opening-copy { font-size: 2.2cqw; font-weight: 600; line-height: 1.35; }

/* 03 Tada thread */
.thread { padding: 1.2cqw 1.4cqw 1.3cqw; }
.tmsg { display: grid; grid-template-columns: 2.5cqw 1fr; gap: .9cqw; }
.tmsg + .tmsg { margin-top: 1.1cqw; padding-top: 1.1cqw; border-top: var(--edge) solid var(--line); }
.tav { width: 2.5cqw; aspect-ratio: 1; display: grid; place-items: center; border-radius: 26%; background: #f2dcc6; color: #6b3417; font-weight: 700; font-size: 1.05cqw; }
.tav.bot { background: var(--orange); color: #fff; }
.who { font-size: .98cqw; font-weight: 700; margin-bottom: .3cqw; }
.who .time { margin-left: .5cqw; color: var(--muted); font-weight: 400; }
.tmsg .bi { font-size: 1.35cqw; line-height: 1.3; }
.hit { display: grid; grid-template-columns: auto 1fr; gap: .2cqw .8cqw; align-items: center; margin-top: .7cqw; padding: .8cqw 1cqw; border: var(--edge) solid #e3c4a4; border-radius: var(--r-md); background: #fff8ef; }
.hit > .ico { grid-row: span 2; font-size: 2cqw; color: var(--label); }
.hit .title { font-size: 1.35cqw; font-weight: 700; }
.hit .meta { font-size: .95cqw; color: var(--muted); }
.more { margin-top: .6cqw; font-size: 1.05cqw; color: var(--muted); }
.ask-around { display: grid; gap: .5cqw; margin-top: 1cqw; }
.bubble { justify-self: start; max-width: 92%; padding: .45cqw .8cqw; border-radius: .9cqw .9cqw .9cqw .25cqw; background: #f1e5d6; font-size: 1cqw; color: #5d524c; }
.bubble:nth-child(2) { justify-self: end; border-radius: .9cqw .9cqw .25cqw .9cqw; }

/* Give the original bilingual reply room to breathe. */
.s-tada .head { margin-top: 2.1cqw; }
.s-tada .head h1 { margin-top: .8cqw; }
.s-tada .main { display: flex; align-items: center; margin-top: 2cqw; }
.tada-reply { width: 100%; padding: 2.3cqw 2.8cqw; }
.tada-reply-head { display: flex; align-items: center; gap: .8cqw; margin-bottom: 1.5cqw; color: var(--label); font-size: 1.2cqw; font-weight: 700; }
.tada-reply-head .tav { width: 2.4cqw; font-size: 1.05cqw; }
.tada-answer { font-size: 1.55cqw; line-height: 1.5; }
.tada-answer > .cn { margin-top: 1.1em; padding-top: 1.1em; border-top: var(--edge) solid var(--line); }
#screen[data-language="zh"] .s-tada .tada-answer > .cn { margin: 0; padding: 0; border: 0; }
@media (max-width: 600px) and (orientation: portrait) {
  .s-tada .head { margin-top: 14px; }
  .s-tada .head h1 { margin-top: 7px; }
  .s-tada .main { display: block; margin-top: 20px; }
  .tada-reply { padding: 18px; }
  .tada-reply-head { gap: 8px; margin-bottom: 14px; }
  .tada-reply-head .tav { width: 24px; }
  #screen .s-tada .tada-answer { font-size: 15px; }
}

/* 04 Use Tada */
.use-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2cqw; }
.use { display: flex; flex-direction: column; gap: 1cqw; padding: 1.9cqw 2cqw; }
.use-ico { width: 3cqw; aspect-ratio: 1; display: grid; place-items: center; border-radius: 50%; background: #fdebd6; color: var(--label); font-size: 1.5cqw; }
.use h2 { font-size: 1.65cqw; line-height: 1.2; }
.use h2 .cn { color: var(--ink); }
.use .how { font-size: 1.4cqw; line-height: 1.35; font-weight: 600; }
.use .bi.note { font-size: 1.25cqw; line-height: 1.35; color: var(--muted); }
.use-foot { display: flex; justify-content: space-between; align-items: center; gap: 1.5cqw; margin-top: 1.6cqw; }
.tips { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); width: 100%; gap: 1.6cqw; font-size: 1.1cqw; }
.tips li { display: flex; align-items: flex-start; gap: .4cqw; }
.tips .ico { margin-top: .15em; color: var(--orange); stroke-width: 2.4; font-size: 1.2cqw; }
.guide { display: inline-flex; align-items: center; gap: .5em; padding: .7cqw 1.15cqw; border-radius: .65cqw; background: #9f350b; color: #fff; font-size: 1.2cqw; font-weight: 700; text-decoration: none; white-space: nowrap; cursor: pointer; border: 0; }
.guide:hover { background: #792604; }
.guide .cn { color: #fff; }
.guide.ghost { background: transparent; color: #7d310e; border: var(--edge) solid #c98f66; }
.guide.ghost .cn { color: #7d310e; }
.guide.ghost:hover { background: #ffe5cc; }

/* 05 Searchable */
.s-searchable .main { display: flex; align-items: center; }
.s-searchable .thread { width: 100%; padding: 2.3cqw 2.6cqw; }
.s-searchable .ba-k { margin-bottom: 1.3cqw; }
.channel-step { padding-top: 1.4cqw; border-top: var(--edge) solid var(--line); font-size: 1.75cqw; line-height: 1.35; font-weight: 600; }
.channel-step .how { display: block; margin-top: .55cqw; font-size: 1.12cqw; font-weight: 400; color: var(--muted); }
#screen[data-language="both"] .channel-step > .cn { margin-top: 1.2em; }
.tada-help { margin-top: 1.8cqw; padding-top: 1.4cqw; border-top: var(--edge) solid var(--line); font-size: 1.12cqw; color: var(--muted); }
#screen[data-language="both"] .tada-help > .cn { margin-top: .75em; }

/* 06 Permissions */

/* 10 Close */
.start { display: grid; gap: 1.2cqw; align-content: center; }
.start li { display: grid; grid-template-columns: 4cqw 1fr auto; align-items: center; gap: 1.4cqw; padding: 1.6cqw 1.8cqw; border: var(--edge) solid var(--line-strong); border-radius: var(--r-lg); background: var(--card); box-shadow: var(--shadow); }
.start .num { font-size: 2.8cqw; line-height: 1; color: var(--orange); }
.start .bi { font-size: 1.55cqw; font-weight: 650; line-height: 1.25; }
.start .when { display: block; margin-bottom: .35cqw; color: var(--label); font-size: 1cqw; font-weight: 650; }
.start .when .cn { color: inherit; }
.start li:last-child { background: #fff1e0; border-color: #e3a678; }

/* Center each page's content as a group instead of stretching empty cards. */
@media (min-width: 601px), (orientation: landscape) {
  .s-use .main { display: flex; flex-direction: column; justify-content: center; }
}
/* Separate longer bilingual passages without adding extra copy. */
.start .bi > .cn { margin-top: .7em; padding-top: .7em; border-top: var(--edge) solid var(--line); }
#screen[data-language="zh"] :is(.start .bi) > .cn { margin: 0; padding: 0; border: 0; }

/* Toolbar and dialogs */
.toolbar { min-height: 49px; display: flex; gap: 6px; padding: 7px 10px; align-items: center; font-size: 12px; color: #61483a; }
.toolbar button, .toolbar select { border: 1px solid #c7ae93; border-radius: 6px; background: #fff8ed; color: #65432c; padding: 5px 9px; cursor: pointer; }
.toolbar button:hover, .toolbar select:hover { background: #ffe6cc; }
.toolbar button:disabled { opacity: .5; cursor: default; }
.toolbar select { min-width: 0; max-width: 46vw; }
.toolbar .push { flex: 1; }
#notes { max-height: 86vh; width: min(740px, 92vw); padding: 24px 26px; border: 1px solid #9e8165; border-radius: 14px; background: var(--paper); color: var(--ink); font-size: 15px; }
#notes::backdrop { background: #1b1512ba; }
#notes header { display: flex; justify-content: space-between; gap: 16px; align-items: center; }
#notes h2 { font-weight: 400; font-size: 23px; }
#notes h3 { margin-top: 18px; font-size: 14px; color: #7d310e; }
#notes p, #notes li { line-height: 1.6; }
#notes p { margin-top: 8px; }
#notes ul, #notes ol { margin-top: 6px; padding-left: 20px; }
#notes ul { list-style: disc; }
#notes ol { list-style: decimal; }
#notes li + li { margin-top: 6px; }
#notes li > p { margin-top: 4px; }
#notes a { color: #7d310e; }
#notes code { padding: 1px 5px; border-radius: 4px; background: #fbe6cf; font-size: 13px; word-break: break-all; }
#notes small { display: block; margin-top: 18px; color: var(--muted); }
#notes button { padding: 6px 10px; border: 1px solid var(--line-strong); border-radius: 6px; background: #ffe8cf; cursor: pointer; }
@media (max-width: 720px) {
  #screen, .toolbar { width: min(100vw, calc((100dvh - 86px) * 16 / 9)); }
  .toolbar { flex-wrap: wrap; justify-content: center; min-height: 80px; }
  .toolbar .push { display: none; }
}
@media (max-width: 600px) and (orientation: portrait) {
  #presenter { display: flex; flex-direction: column; align-items: stretch; }
  #screen, #presenter:fullscreen #screen { width: 100%; aspect-ratio: auto; overflow: visible; container-type: normal; }
  #screen .scene { position: relative; min-height: calc(100dvh - 92px); padding: 18px; font-size: 13px; }
  #screen .scene * { font-size: inherit; }
  #screen .scene h1 { font-size: 26px; }
  #screen .scene h2 { font-size: 18px; }
  .case-head h1 { margin-top: 7px; }
  #screen .scene .layer .num, #screen .scene .start .num { font-size: 22px; }
  .toolbar { width: 100%; position: sticky; bottom: 0; z-index: 1; background: #f3e7d6; }
  .mast { letter-spacing: 0; }
  .track { gap: 6px; flex-wrap: wrap; }
  .track .n { width: 16px; }
  .head, .main { margin-top: 14px; }
  .start { align-content: start; }
  .use-grid { grid-template-columns: 1fr; gap: 10px; }
  .start li { width: 100%; grid-template-columns: 28px 1fr; padding: 10px; gap: 8px; }
  .start li > :last-child { grid-column: 2; justify-self: start; }
  .card, .thread, .use { padding: 10px; }
  .use-foot { display: grid; gap: 10px; }
  .tips { grid-template-columns: 1fr; gap: 10px; }
  .tav, .use-ico { width: 22px; }
  .tmsg { grid-template-columns: 28px 1fr; gap: 6px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01s !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; transition-duration: .01s !important; }
}
</style>
</head>

  <symbol id="i-doc" viewBox="0 0 24 24"><path d="M6.5 3.5h7.5l4 4v13h-11.5z"/><path d="M14 3.5v4h4"/><path d="M9.5 12h6M9.5 15h6M9.5 18h4"/></symbol>

<main id="presenter">
  <div id="screen" aria-label="Collaboration presentation" data-language="both"></div>
  <nav class="toolbar" aria-label="Presentation controls">
    <button id="prev" type="button" aria-label="Previous slide" aria-keyshortcuts="ArrowLeft">‹</button>
    <button id="next" type="button" aria-label="Next slide" aria-keyshortcuts="ArrowRight">Next ›</button>
    <select id="chapters" aria-label="Slides"></select>
    <span class="push"></span>
    <button id="full" type="button" aria-keyshortcuts="F">Full screen</button>
  </nav>
  <dialog id="notes" aria-labelledby="notes-title">
    <header><h2 id="notes-title"></h2><button id="close-notes" type="button">Close</button></header>
    <div id="note-content"></div>
  </dialog>
</main>

<template id="opening">
  <section class="scene s-open warm" data-label="Meet Tada">
    <header class="head">
      <p class="eyebrow biline arrive"><span lang="en" class="heading-en">GLORIFY · IN SLACK</span></p>
      <h1 class="bi arrive" style="--d:.1s"><span lang="en" class="heading-en">Meet Tada</span></h1>
    </header>
    <div class="main opening-stage">
      <div class="card opening-card paper-in" style="--d:.4s">
        <p class="opening-copy bi"><span lang="en">Find answers together in Slack.</span><span class="cn" lang="zh-Hans">在 Slack 中一起找到答案。</span></p>
      </div>
    </div>
  </section>
</template>



<template id="tada">
  <section class="scene s-tada warm" data-label="Ask Tada">
    <header class="head arrive" style="--d:.2s">
      <p class="eyebrow biline"><span lang="en" class="heading-en">USE CASE · IN SLACK · DM TADA</span></p>
      <h1 class="bi"><span lang="en" class="heading-en">What is Feeling Together?</span></h1>
    </header>
    <div class="main">
      <div class="card tada-reply paper-in" style="--d:1.1s">
        <p class="tada-reply-head biline"><span class="tav bot" aria-hidden="true">T</span><span lang="en" class="heading-en">Tada · REAL SLACK REPLY</span></p>
        <p class="tada-answer bi"><span lang="en">Feeling Together is a <mark style="--md:2.4s">mutual mood-sharing feature between friends</mark>: a user sends a request from a friend’s profile, and a link is established once accepted. After linking, each person can view the other’s most recent mood and independently control whether to share their own mood.</span><span class="cn" lang="zh-Hans">Feeling Together 是<mark style="--md:2.4s">好友之间的双向心情共享功能</mark>：用户可在好友 Profile 发起请求，对方接受后建立绑定。绑定后，双方可查看对方最近一条心情，并可各自控制向该好友分享心情的开关。</span></p>
      </div>

    </div>
  </section>
</template>

<template id="tada-use">
  <section class="scene s-use" data-label="How to use Tada">
    <header class="head arrive"><h1 class="bi"><span lang="en" class="heading-en">Where do I ask Tada?</span></h1></header>
    <div class="main">
      <div class="use-grid">
        <article class="card use paper-in" style="--d:.2s">

<template id="searchable">
  <section class="scene s-searchable warm" data-label="Get started with Tada">
    <header class="head arrive"><h1 class="bi"><span lang="en" class="heading-en">Get started with Tada</span></h1></header>
    <div class="main">
      <div class="card thread paper-in" style="--d:.4s">
        <p class="ba-k after-k biline"><span lang="en">Ask Tada in a channel</span><span class="cn" lang="zh-Hans">在频道里问 Tada</span></p>
        <p class="channel-step bi arrive" style="--d:.7s"><span lang="en">Add Tada to a channel, then ask with @Tada.<span class="how">Channel header → Agents &amp; apps → Add Tada</span></span><span class="cn" lang="zh-Hans">把 Tada 加入频道，然后 @Tada 提问。<span class="how">频道顶部 → Agents &amp; apps → 添加 Tada</span></span></p>
        <p class="tada-help bi arrive" style="--d:1s"><span lang="en">If Tada isn’t working, contact Ken Ge.</span><span class="cn" lang="zh-Hans">如果 Tada 用不了，请联系 Ken Ge。</span></p>

<template id="close">
  <section class="scene s-close warm" data-label="Try Tada">
    <header class="head arrive"><h1 class="bi"><span lang="en" class="heading-en">Try Tada</span></h1></header>
    <ol class="main start">
      <li class="arrive" style="--d:.3s"><span class="num">1</span><span><span class="when biline"><span lang="en" class="heading-en">After this meeting</span></span><span class="bi"><span lang="en">In Slack, ask Tada about a team question.</span><span class="cn" lang="zh-Hans">在 Slack 问 Tada 一个团队问题。</span></span></span><button type="button" class="guide" data-open-tool-setup="tada"><span lang="en" class="always-en">How to connect →</span></button></li>
    </ol>
  </section>
</template>

<script>
const setupSteps = [
  { key: "tada", title: "Tada · Slack", steps: [
    { en: "In Slack, search Apps for Tada and open it.", zh: "在 Slack 应用中搜索并打开 Tada。" },
    { en: "Ask Tada in a DM, or @Tada in a channel it has joined.", zh: "私聊 Tada，或在它已加入的频道里 @Tada。" },
    { en: "If Tada isn’t working, contact Ken Ge.", zh: "如果 Tada 用不了，请联系 Ken Ge。" }
  ] }
];

const chapters = [
  { id: "opening", stage: -1, time: "0:00–0:20",
    say: ["今天介绍如何在 Slack 使用 Tada，快速查找团队资料。"] },
  { id: "tada", stage: 0, time: "0:20–0:55",
    say: ["这是在 Slack 私聊 Tada 的真实提问：什么是 Feeling Together？", "接着看 Tada 的中英文回答。"],
    facts: ["2026-11-10 用户通过 Slack 私聊 Tada。完整原始提问：What is Feeling Together？Please describe this function in no more than two sentences each in Chinese and English, and include the source of the information.", "页面展示回复正文原文，中英文顺序调整为英文在前。Tada 当时注明无法核验实时来源；参考资料为《05 Confidein ／ Bless Ring 当前 App 功能记录》（2026-11-05）和《Feeling Together（心情绑定与送戒指）PRD》（2026-11-02）。"] },
  { id: "tada-use", stage: 1, time: "0:55–1:20",
    say: ["在已加入 Tada 的频道 @Tada，频道里的人能看到回答；也可以在 Slack 找到 Tada 并私聊。", "例如，直接问 Tada 找已接入的公司需求文档。"],
    facts: ["频道问答要求 Tada 在该频道；可查询范围取决于资料接入和访问权限。"] },
  { id: "searchable", stage: 1, time: "1:20–1:45",
    say: ["想让同事一起看回答，就把 Tada 加入频道，然后 @Tada 提问。如果 Tada 用不了，请联系 Ken Ge。"] },
  { id: "close", stage: -1, time: "1:45–2:05",
    say: ["会后在 Slack 向 Tada 问一个团队问题。需要帮助时，联系 Ken Ge。"] }
];
const stages = ["Ask Tada", "How to use Tada"];

const presenter = document.querySelector("#presenter");
const screen = document.querySelector("#screen");
const chapterSelect = document.querySelector("#chapters");
const notes = document.querySelector("#notes");
const prev = document.querySelector("#prev");
const next = document.querySelector("#next");
const languages = ["both", "en", "zh"];
const pad = n => String(n).padStart(2, "0");
const sceneLabel = index => document.getElementById(chapters[index].id).content.firstElementChild.dataset.label;
let current = 0;

for (let index = 0; index < chapters.length; index++) {
  chapterSelect.add(new Option(`${pad(index + 1)}  ${sceneLabel(index)}`, index));
}
function show(index) {
  const chapter = chapters[index];
  if (!chapter) return;
  current = index;
  const scene = document.getElementById(chapter.id).content.firstElementChild.cloneNode(true);
  const mast = document.createElement("div");
  mast.className = "mast";
  const track = stages.map((en, step) =>
    `<li${step === chapter.stage ? ' class="on" aria-current="step"' : ""}><span class="n">${step + 1}</span><span lang="en" class="heading-en">${en}</span></li>`).join("");
  mast.innerHTML = `<ol class="track">${track}</ol><span>${pad(index + 1)} / ${pad(chapters.length)}</span>`;
  scene.prepend(mast);
  screen.replaceChildren(scene);
  chapterSelect.value = String(index);
  prev.disabled = index === 0;
  next.disabled = index === chapters.length - 1;
}
function cycleLanguage() {
  const value = languages[(languages.indexOf(screen.dataset.language) + 1) % languages.length];
  screen.dataset.language = value;
  screen.classList.toggle("no-chinese", value === "en");
  document.documentElement.lang = value === "zh" ? "zh-Hans" : "en";
}
async function toggleFullscreen() {
  try {
    if (document.fullscreenElement) await document.exitFullscreen();
    else await presenter.requestFullscreen();
  } catch {
    document.querySelector("#full").textContent = "Use browser full screen";
  }
}
function noteSection(title, items) {
  const heading = document.createElement("h3");
  heading.textContent = title;
  const list = document.createElement("ul");
  for (const item of items) {
    const entry = document.createElement("li");
    entry.innerHTML = item;
    list.append(entry);
  }
  return [heading, list];
}
function setupParts(tool) {
  const parts = [];
  for (const section of setupSteps) {
    if (tool && section.key !== tool) continue;
    const heading = document.createElement("h3");
    heading.textContent = section.title;
    const list = document.createElement("ol");
    for (const step of section.steps) {
      const entry = document.createElement("li");
      const en = document.createElement("p");
      const zh = document.createElement("p");
      en.lang = "en";
      en.textContent = step.en;
      zh.lang = "zh-Hans";
      zh.textContent = step.zh;
      entry.append(en, zh);
      list.append(entry);
    }
    parts.push(heading, list);
  }
  return parts;
}
function openSetup(tool) {
  const titles = { tada: "How to connect Tada" };
  document.querySelector("#notes-title").textContent = titles[tool] || "Setup";
  document.querySelector("#note-content").replaceChildren(...setupParts(tool));
  notes.showModal();
}
function openNotes() {
  const chapter = chapters[current];
  document.querySelector("#notes-title").textContent = `${pad(current + 1)} ${sceneLabel(current)} · ${chapter.time}`;
  const parts = [...noteSection("Speaker notes", chapter.say)];
  if (chapter.facts) parts.push(...noteSection("Sources", chapter.facts));
  const timing = document.createElement("small");
  timing.textContent = "讲者备注（N）。C 切换中英 / 英文 / 中文，R 重播动画，F 全屏。";
  parts.push(timing);
  document.querySelector("#note-content").replaceChildren(...parts);
  notes.showModal();
}

prev.addEventListener("click", () => show(current - 1));
next.addEventListener("click", () => show(current + 1));
chapterSelect.addEventListener("change", () => show(Number(chapterSelect.value)));
document.querySelector("#close-notes").addEventListener("click", () => notes.close());
document.querySelector("#full").addEventListener("click", toggleFullscreen);
screen.addEventListener("click", event => {
  const toolSetup = event.target.closest("[data-open-tool-setup]");
  if (toolSetup) {
    openSetup(toolSetup.dataset.openToolSetup);
  }
});
document.addEventListener("keydown", event => {
  if (event.repeat || notes.open || event.target.closest("select, a") ||
      event.ctrlKey || event.altKey || event.metaKey) return;
  switch (event.key.toLowerCase()) {
    case "arrowright":
    case "pagedown":
      event.preventDefault();
      show(current + 1);
      break;
    case "arrowleft":
    case "pageup":
      event.preventDefault();
      show(current - 1);
      break;
    case " ":
      if (event.target.closest("button")) break;
      event.preventDefault();
      show(current + 1);
      break;
    case "f": toggleFullscreen(); break;
    case "c": cycleLanguage(); break;
    case "r": show(current); break;
    case "n": openNotes(); break;
  }
});
show(0);
</script>
</body>
</html>
