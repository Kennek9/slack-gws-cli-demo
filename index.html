<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#FFF8E9">
<link rel="icon" href="data:,">
<title>How we work together · 合并后的协作方式</title>
<style>
:root {
  --paper: #fff8e9;
  --orange: #ff4e00;
  --ink: #232222;
  --muted: #69605b;
  --cn: #574d48;
  --label: #96390c;
  --card: #fffdf8;
  --line: #eadbc8;
  --line-strong: #d6bc9f;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r-lg: 1.15cqw;
  --r-md: .8cqw;
  --r-sm: .5cqw;
  --edge: max(1px, .06cqw);
  --shadow: 0 .1cqw .3cqw #6b3f1a0d, 0 .9cqw 2.4cqw #6b3f1a14;
  font-family: var(--sans);
  color: var(--ink);
  background: #f3e7d6;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; }
h1, h2, h3, p, figure, blockquote, ol, ul { margin: 0; }
ol, ul { padding: 0; list-style: none; }
button, select, textarea { font: inherit; color: inherit; }
button, select, a { touch-action: manipulation; }
button:focus-visible, select:focus-visible, a:focus-visible, textarea:focus-visible { outline: 2px solid var(--orange); outline-offset: 3px; }
.ico { width: 1em; height: 1em; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

/* Stage */
#presenter { min-height: 100dvh; display: grid; place-content: center; justify-items: center; background: #f3e7d6; }
#screen, .toolbar { width: min(100vw, calc((100dvh - 51px) * 16 / 9)); }
#screen { position: relative; container-type: inline-size; overflow: hidden; aspect-ratio: 16 / 9; background: var(--paper); }
#presenter:fullscreen #screen { width: min(100vw, calc(100dvh * 16 / 9)); }
#presenter:fullscreen .toolbar { display: none; }

.scene {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  padding: 2.9cqw 5.6cqw 2.3cqw;
  background: var(--paper);
  animation: scene-in .35s ease-out both;
}
.scene.warm { background: radial-gradient(110% 85% at 90% 105%, #ffe5c9 0%, transparent 62%), var(--paper); }
.mast { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: .92cqw; font-weight: 600; letter-spacing: .08em; }
.track { display: flex; gap: 2.1cqw; }
.track li { display: inline-flex; align-items: center; color: #ab9d93; }
.track li::before { content: ""; width: .45cqw; aspect-ratio: 1; margin-right: .55cqw; border-radius: 50%; background: #e4d0bc; }
.track li.on { color: var(--ink); }
.track li.on::before { background: var(--orange); }
.track .cn { margin-left: .45em; color: inherit; letter-spacing: .02em; }
.head { margin-top: 2.4cqw; }
.eyebrow { font-size: 1.12cqw; font-weight: 650; color: var(--label); }
.eyebrow .cn { color: #7a4a33; }
h1 { font-family: var(--serif); font-weight: 400; font-size: 3.3cqw; line-height: 1.08; margin-top: .5cqw; }
h1 .cn { color: var(--muted); font-family: var(--sans); margin-top: .28em; }
.main { flex: 1; min-height: 0; margin-top: 2.2cqw; }
.foot { margin-top: auto; padding-top: 1cqw; font-size: 1cqw; color: var(--muted); }
.foot::before { content: ""; display: inline-block; width: .4cqw; aspect-ratio: 1; margin-right: .6cqw; border-radius: 50%; background: #d9b796; vertical-align: .15cqw; }

/* Bilingual */
.cn { color: var(--cn); font-family: var(--sans); }
.no-chinese .cn { display: none !important; }
.bi > span { display: block; }
.bi > .cn { margin-top: .22em; }
.biline > .cn { margin-left: .5em; }

/* Shared pieces */
.card { background: var(--card); border: var(--edge) solid var(--line-strong); border-radius: var(--r-lg); box-shadow: var(--shadow); }
@keyframes scene-in { from { opacity: 0; } }

.step-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.4cqw; }
.step, .panel { padding: 1.55cqw 1.75cqw; }
.step { display: flex; flex-direction: column; gap: .85cqw; }
.step-number, .label { color: var(--label); font-weight: 700; font-size: 1.12cqw; }
.step h2, .panel h2 { font-size: 1.65cqw; line-height: 1.2; }
.step p, .panel p, .panel li, .meta { font-size: 1.4cqw; line-height: 1.4; }
.panel p + p, .panel li + li { margin-top: .65cqw; }
.panel h2 { margin-bottom: .95cqw; }
.duo { display: grid; grid-template-columns: 1fr 1fr; gap: 1.35cqw; align-content: start; }
.accent { border-color: #c77745; background: #fff4e5; }
.prompt { background: #fff8ed; border-left: .22cqw solid var(--orange); padding: .55cqw .75cqw; }
.result { color: #6b3012; font-weight: 680; }
.meta { margin-top: .85cqw; color: var(--muted); }
.access-line { display: flex; justify-content: space-between; align-items: center; gap: 1cqw; margin-top: 1.2cqw; }
.guide { display: inline-block; padding: .7cqw 1.1cqw; border-radius: .65cqw; background: #9f350b; color: white; font-size: 1.34cqw; font-weight: 700; text-decoration: none; }
.guide:hover { background: #792604; }
.guide .cn { color: white; }
code { font-family: var(--mono); font-size: .9em; }
.table { border-collapse: collapse; width: 100%; font-size: 1.28cqw; line-height: 1.24; }
.table th, .table td { padding: .43cqw .9cqw; border-bottom: 1px solid var(--line); text-align: left; }
.table thead th { color: var(--label); font-size: 1.12cqw; }
.table tbody tr:first-child { background: #fff2e1; }
.table td[data-window] { white-space: nowrap; font-variant-numeric: tabular-nums; }
.time-table { margin-top: .65cqw; }
.time-table + .meta { font-size: 1.15cqw; margin-top: .65cqw; }
.hero { margin-top: 4.1cqw; }
.hero h1 { font-size: 4.2cqw; }
.hero + .main { margin-top: 3.4cqw; }
.finish { display: grid; justify-items: start; align-content: center; gap: 1.45cqw; }
.finish .guide { font-size: 1.55cqw; }
.scene a:not(.guide) { color: var(--label); }
#screen[data-language="zh"] [lang="en"] { display: none !important; }
#screen[data-language="zh"] .cn { margin-left: 0; }
.toolbar #chapters { min-width: 0; max-width: 42vw; }
@media (max-width: 600px) and (orientation: portrait) {
  #presenter { display: flex; flex-direction: column; align-items: stretch; }
  #screen, #presenter:fullscreen #screen { width: 100%; aspect-ratio: auto; overflow: visible; }
  #screen .scene { position: relative; min-height: calc(100dvh - 92px); padding: 18px; }
  .toolbar { width: 100%; position: sticky; bottom: 0; z-index: 1; background: #f3e7d6; }
  .mast { font-size: 10px; letter-spacing: 0; }
  .track { gap: 6px; }
  .head, .hero, .hero + .main, .main { margin-top: 16px; }
  .eyebrow, .foot, .label, .step-number { font-size: 12px; }
  h1, .hero h1 { font-size: 28px; }
  .step-grid, .duo { grid-template-columns: 1fr; gap: 8px; }
  .step, .panel { padding: 11px; }
  .step h2, .panel h2 { font-size: 16px; margin-bottom: 4px; }
  .step p, .panel p, .panel li, .meta, .time-table + .meta { font-size: 13px; }
  .access-line { display: grid; justify-content: start; gap: 8px; margin-top: 12px; }
  .guide, .finish .guide { font-size: 14px; padding: 8px 10px; }
  .table, .table thead th { font-size: 11px; }
  .table th, .table td { padding: 5px 4px; }
  .table td[data-window] { white-space: normal; }
  .finish { padding: 16px 0; gap: 12px; }
  .foot { padding-top: 14px; }
}
/* Toolbar and notes */
.toolbar { min-height: 49px; display: flex; gap: 6px; padding: 7px 10px; align-items: center; font-size: 12px; color: #61483a; }
.toolbar button, .toolbar select { border: 1px solid #c7ae93; border-radius: 6px; background: #fff8ed; color: #65432c; padding: 5px 9px; cursor: pointer; }
.toolbar button:hover, .toolbar select:hover { background: #ffe6cc; }
.toolbar button:disabled { opacity: .5; cursor: default; }
.toolbar .push { flex: 1; }
#notes { max-height: 86vh; width: min(720px, 92vw); padding: 24px 26px; border: 1px solid #9e8165; border-radius: 14px; background: var(--paper); color: var(--ink); font-size: 15px; }
#notes::backdrop { background: #1b1512ba; }
#notes header { display: flex; justify-content: space-between; gap: 16px; align-items: center; }
#notes h2 { font-family: var(--serif); font-weight: 400; font-size: 23px; }
#notes h3 { margin-top: 18px; font-size: 14px; color: #7d310e; }
#notes p, #notes li { line-height: 1.6; }
#notes p { margin-top: 8px; }
#notes ul, #notes ol { margin-top: 6px; padding-left: 20px; }
#notes ul { list-style: disc; }
#notes ol { list-style: decimal; }
#notes li + li { margin-top: 5px; }
#notes a { color: #7d310e; }
#notes code { padding: 1px 5px; border-radius: 4px; background: #fbe6cf; font-family: var(--mono); font-size: 13px; word-break: break-all; }
#notes small { display: block; margin-top: 18px; color: var(--muted); }
#notes button { padding: 6px 10px; border: 1px solid var(--line-strong); border-radius: 6px; background: #ffe8cf; cursor: pointer; }
.request-box { margin-top: 10px; padding: 12px; border: 1px solid var(--line-strong); border-radius: 8px; background: #fff2df; }
.request-box label { display: block; font-size: 13px; font-weight: 650; color: #753610; }
.request-box textarea { display: block; width: 100%; min-height: 122px; margin: 8px 0; padding: 8px; border: 1px solid var(--line-strong); border-radius: 5px; background: #fffaf1; font-size: 13px; line-height: 1.5; resize: vertical; }
.request-box [role="status"] { margin-left: 8px; font-size: 12px; color: #753610; }
@media (max-width: 720px) {
  #screen, .toolbar { width: min(100vw, calc((100dvh - 86px) * 16 / 9)); }
  .toolbar { flex-wrap: wrap; justify-content: center; min-height: 80px; }
  .toolbar .push { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01s !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; transition-duration: .01s !important; }
}
</style>
</head>
<body>
<main id="presenter">
  <div id="screen" aria-label="Collaboration presentation"></div>
  <nav class="toolbar" aria-label="Presentation controls">
    <button id="prev" type="button" aria-label="Previous scene" aria-keyshortcuts="ArrowLeft">‹</button>
    <button id="next" type="button" aria-label="Next scene" aria-keyshortcuts="ArrowRight">Next ›</button>
    <select id="chapters" aria-label="Scenes"></select>
    <span class="push"></span>
    <select id="language" aria-label="Presentation language" aria-keyshortcuts="C">
      <option value="both">中 / EN</option><option value="en">English</option><option value="zh">中文</option>
    </select>
    <button id="speaker" type="button" aria-keyshortcuts="N">Notes</button>
    <button id="full" type="button" aria-keyshortcuts="F">Full screen</button>
  </nav>
  <dialog id="notes" aria-labelledby="notes-title">
    <header><h2 id="notes-title"></h2><button id="close-notes" type="button">Close</button></header>
    <div id="note-content"></div>
  </dialog>
</main>

<template id="opening">
  <section class="scene warm" data-label="How we work together / 合并后怎么协作">
    <div class="head hero">
      <p class="eyebrow biline"><span lang="en">Glorify · Working together</span><span class="cn" lang="zh-Hans">合并后的工作方式</span></p>
      <h1 class="bi"><span lang="en">How we work together</span><span class="cn" lang="zh-Hans">合并后，我们怎么协作</span></h1>
    </div>
    <div class="main step-grid">
      <div class="card step"><span class="step-number">01</span><h2 class="bi"><span lang="en">Find each other</span><span class="cn" lang="zh-Hans">找到彼此</span></h2><p class="bi"><span lang="en">Set your working hours.</span><span class="cn" lang="zh-Hans">标明你的工作时间。</span></p></div>
      <div class="card step"><span class="step-number">02</span><h2 class="bi"><span lang="en">Find company info</span><span class="cn" lang="zh-Hans">找到公司资料</span></h2><p class="bi"><span lang="en">Ask Tada in Slack.</span><span class="cn" lang="zh-Hans">在 Slack 里问 Tada。</span></p></div>
      <div class="card step"><span class="step-number">03</span><h2 class="bi"><span lang="en">Do a task with AI</span><span class="cn" lang="zh-Hans">用 AI 完成一项工作</span></h2><p class="bi"><span lang="en">Use Slack and Google together.</span><span class="cn" lang="zh-Hans">让个人 Agent 同时读 Slack 和 Google。</span></p></div>
    </div>
  </section>
</template>

<template id="hours">
  <section class="scene" data-label="Working hours / 工作时间">
    <div class="head">
      <h1 class="bi"><span lang="en">Make your working hours visible</span><span class="cn" lang="zh-Hans">在日历标明工作时间</span></h1>
    </div>
    <div class="main">
      <p class="meta bi"><span lang="en">China team: make at least one Beijing-time window available.</span><span class="cn" lang="zh-Hans">中国员工至少开放下面一个北京时间段。</span></p>
      <table class="table time-table" aria-label="Local working windows">
        <thead><tr><th scope="col" class="biline"><span lang="en">Local time</span><span class="cn" lang="zh-Hans">当地时间</span></th><th scope="col">08:00–10:00</th><th scope="col">22:00–24:00</th></tr></thead>
        <tbody>
          <tr><th scope="row" class="biline"><span lang="en">Beijing</span><span class="cn" lang="zh-Hans">北京</span></th><td>08:00–10:00</td><td>22:00–24:00</td></tr>
          <tr data-zone="America/Los_Angeles"><th scope="row" class="biline"><span lang="en">US Pacific</span><span class="cn" lang="zh-Hans">美国西海岸</span></th><td data-window></td><td data-window></td></tr>
          <tr data-zone="Europe/London"><th scope="row" class="biline"><span lang="en">UK</span><span class="cn" lang="zh-Hans">英国</span></th><td data-window></td><td data-window></td></tr>
          <tr data-zone="America/Mexico_City"><th scope="row" class="biline"><span lang="en">Mexico City</span><span class="cn" lang="zh-Hans">墨西哥城</span></th><td data-window></td><td data-window></td></tr>
          <tr data-zone="America/Sao_Paulo"><th scope="row" class="biline"><span lang="en">São Paulo</span><span class="cn" lang="zh-Hans">圣保罗</span></th><td data-window></td><td data-window></td></tr>
        </tbody>
      </table>
      <p class="meta biline"><span lang="en">Beijing date</span><span class="cn" lang="zh-Hans">北京日期</span> <time data-reference-day></time> · <span lang="en">Previous day is marked. Daylight saving can shift local times.</span><span class="cn" lang="zh-Hans">已标注前一天，夏令时可能改变当地时间。</span></p>
    </div>
    <p class="foot biline"><a class="biline" href="https://support.google.com/calendar/answer/7638168?co=GENIE.Platform%3DDesktop" target="_blank" rel="noopener noreferrer"><span lang="en">Google Calendar → Working hours</span><span class="cn" lang="zh-Hans">Google 日历 → 工作时间</span></a><span lang="en"> · Missing the setting? Ask the Operation Team.</span><span class="cn" lang="zh-Hans">找不到设置，联系 Operation Team。</span></p>
  </section>
</template>

<template id="tada">
  <section class="scene warm" data-label="Ask Tada / 第一次问 Tada">
    <div class="head"><h1 class="bi"><span lang="en">Find a company doc with Tada</span><span class="cn" lang="zh-Hans">在 Slack 里用 Tada 找资料</span></h1></div>
    <div class="main duo">
      <div class="panel card"><h2 class="biline"><span lang="en">Before</span><span class="cn" lang="zh-Hans">以前</span></h2><p class="bi"><span lang="en">Ask around for the onboarding guide. Check which link is current.</span><span class="cn" lang="zh-Hans">问同事入职指南在哪，再确认哪个链接是最新版。</span></p></div>
      <div class="panel card accent"><h2 class="biline"><span lang="en">After</span><span class="cn" lang="zh-Hans">现在</span></h2>
        <p class="prompt bi"><span lang="en">@Tada Find the Beijing office onboarding guide and give me the original link.</span><span class="cn" lang="zh-Hans">@Tada 请找北京办公室的入职指南，给我原文链接。</span></p>
        <p class="result bi"><span lang="en">Example reply: Beijing office onboarding guide · Original source</span><span class="cn" lang="zh-Hans">回复示例：北京办公室入职指南 · 原文</span></p>
      </div>
    </div>
    <p class="foot biline"><span lang="en">Ask in an enabled channel. Follow up in the same thread.</span><span class="cn" lang="zh-Hans">在已开通的频道提问，在同一线程继续追问。</span></p>
  </section>
</template>

<template id="access">
  <section class="scene" data-label="Get access / 开通与授权">
    <div class="head"><h1 class="bi"><span lang="en">Check your Tada access</span><span class="cn" lang="zh-Hans">先确认 Tada 权限</span></h1></div>
    <div class="main">
      <div class="duo">
        <div class="card panel"><h2 class="bi"><span lang="en">Ask about published docs</span><span class="cn" lang="zh-Hans">查已发布的公司资料</span></h2><p><code>/tada status</code></p><p class="bi"><span lang="en">Access denied? Ask your Tada admin. Published docs don’t need a Drive connection.</span><span class="cn" lang="zh-Hans">没权限找 Tada 管理员。查已发布资料无需连接 Drive。</span></p></div>
        <div class="card panel"><h2 class="bi"><span lang="en">Read a file with your Drive access</span><span class="cn" lang="zh-Hans">用自己的权限读取 Drive 原件</span></h2><p class="bi"><span lang="en">Open my workspace → link in your DM → Google Drive → Connect.</span><span class="cn" lang="zh-Hans">打开我的工作台 → Slack 私聊链接 → Google Drive → 连接。</span></p></div>
      </div>
      <div class="access-line"><p class="meta bi"><span lang="en">Pilot for enabled employees.</span><span class="cn" lang="zh-Hans">已开通员工可试用。</span></p><a class="guide biline" data-guide target="_blank" rel="noopener noreferrer"><span lang="en">Open the guide ↗</span><span class="cn" lang="zh-Hans">打开中英教程</span></a></div>
    </div>
  </section>
</template>

<template id="google">
  <section class="scene" data-label="Google → table / Google → 表格">
    <div class="head"><h1 class="bi"><span lang="en">Turn a spec into a table</span><span class="cn" lang="zh-Hans">从 Google 文档提取范围表</span></h1></div>
    <div class="main duo">
      <div class="card panel"><h2 class="biline"><span lang="en">Input</span><span class="cn" lang="zh-Hans">输入</span></h2><p class="prompt bi"><span lang="en">Read the spec. Put each request notification in a table and say whether it’s in this release.</span><span class="cn" lang="zh-Hans">读规格，把好友请求的通知入口和本期范围整理成表。</span></p></div>
      <div class="card panel accent"><h2 class="biline"><span lang="en">Output</span><span class="cn" lang="zh-Hans">拿到</span></h2><table class="table"><thead><tr><th scope="col" class="biline"><span lang="en">Surface</span><span class="cn" lang="zh-Hans">入口</span></th><th scope="col" class="biline"><span lang="en">Scope</span><span class="cn" lang="zh-Hans">范围</span></th></tr></thead>
        <tbody><tr><th scope="row" class="biline"><span lang="en">Requests</span><span class="cn" lang="zh-Hans">申请列表</span></th><td class="biline"><span lang="en">Existing</span><span class="cn" lang="zh-Hans">已有</span></td></tr>
        <tr><th scope="row" class="biline"><span lang="en">In-app bell</span><span class="cn" lang="zh-Hans">App 内铃铛</span></th><td class="biline"><span lang="en">This release</span><span class="cn" lang="zh-Hans">本期</span></td></tr>
        <tr><th scope="row" class="biline"><span lang="en">Phone push</span><span class="cn" lang="zh-Hans">系统推送</span></th><td class="biline"><span lang="en">Later</span><span class="cn" lang="zh-Hans">后续</span></td></tr></tbody>
      </table></div>
    </div>
    <p class="foot biline"><span lang="en">Anonymized example · Personal agent with Google access</span><span class="cn" lang="zh-Hans">脱敏示例 · 个人 Agent 连接 Google</span></p>
  </section>
</template>

<template id="slack">
  <section class="scene warm" data-label="Slack → decision / Slack → 决定">
    <div class="head"><h1 class="bi"><span lang="en">Find the decision in Slack</span><span class="cn" lang="zh-Hans">从 Slack 找回决定</span></h1></div>
    <div class="main duo">
      <div class="card panel"><h2 class="biline"><span lang="en">Input</span><span class="cn" lang="zh-Hans">输入</span></h2><p class="prompt bi"><span lang="en">Search Slack for the request notification update. What’s in this release? Give me the message link.</span><span class="cn" lang="zh-Hans">查 Slack 里好友请求通知的更新。这期做什么？给我原消息链接。</span></p></div>
      <div class="card panel accent"><h2 class="biline"><span lang="en">Output</span><span class="cn" lang="zh-Hans">拿到</span></h2><p class="result bi"><span lang="en">In-app notifications this release. Phone push later.</span><span class="cn" lang="zh-Hans">这期做 App 内通知。系统推送留到后续。</span></p><p class="meta bi"><span lang="en">Source: Slack scope update.</span><span class="cn" lang="zh-Hans">来源：Slack 范围更新。</span></p></div>
    </div>
    <p class="foot biline"><span lang="en">Anonymized example · Personal agent with Slack access</span><span class="cn" lang="zh-Hans">脱敏示例 · 个人 Agent 连接 Slack</span></p>
  </section>
</template>

<template id="combine">
  <section class="scene" data-label="Slack + Google → Doc / 生成评审说明">
    <div class="head"><h1 class="bi"><span lang="en">Write a brief from both sources</span><span class="cn" lang="zh-Hans">对照两处材料，生成评审说明</span></h1></div>
    <div class="main duo">
      <div class="card panel"><h2 class="biline"><span lang="en">Input</span><span class="cn" lang="zh-Hans">输入</span></h2><p class="prompt bi"><span lang="en">Compare the Slack update and the spec. Create a new Google Doc with the decision and links to both sources.</span><span class="cn" lang="zh-Hans">对照 Slack 更新和规格，新建一份 Google 文档，写清决定并附上两处来源。</span></p></div>
      <div class="card panel accent"><h2 class="biline"><span lang="en">New Google Doc</span><span class="cn" lang="zh-Hans">新 Google 文档</span></h2><p class="result bi"><span lang="en">Keep the existing request list. Add an in-app alert. Phone push follows later.</span><span class="cn" lang="zh-Hans">保留原申请列表。新增 App 内提醒。系统推送后续做。</span></p><p class="meta bi"><span lang="en">Sources: Slack update + Google spec.</span><span class="cn" lang="zh-Hans">来源：Slack 更新 + Google 规格。</span></p></div>
    </div>
    <p class="foot biline"><span lang="en">Anonymized example · Review the draft before sharing.</span><span class="cn" lang="zh-Hans">脱敏示例 · 核对草稿和来源后再分享。</span></p>
  </section>
</template>

<template id="finish">
  <section class="scene warm" data-label="Try Tada / 试一次">
    <div class="head hero"><h1 class="bi"><span lang="en">Ask Tada one real question</span><span class="cn" lang="zh-Hans">会后，用 Tada 问一个真实问题</span></h1></div>
    <div class="main finish">
      <p class="meta bi"><span lang="en">Use your company Google account to open the guide. Pilot for enabled employees.</span><span class="cn" lang="zh-Hans">用公司 Google 账号打开教程。已开通员工可试用。</span></p>
      <a class="guide biline" data-guide target="_blank" rel="noopener noreferrer"><span lang="en">Open the guide ↗</span><span class="cn" lang="zh-Hans">打开中英教程</span></a>
    </div>
  </section>
</template>

<script>
const guideUrl = "https://docs.google.com/document/d/1BOI80LqwMVBZFWf1ZwdUfLRzD_eu_ZL5rbjGNcDmmO4/edit";
const chapters = [
  { id: "opening", stage: 0, time: "0:00–0:25", say: "先让跨国同事找得到彼此，再用 Tada 找资料，最后让个人 Agent 交付一项具体工作。" },
  { id: "hours", stage: 0, time: "0:25–1:20", say: "中国员工选至少一个北京协作窗口。用电脑打开 Google Calendar → 设置 → 工作时间或工作时间与地点 → 启用并选日期和时段。找不到设置，联系 Operation Team。" },
  { id: "tada", stage: 1, time: "1:20–2:30", say: "在获准测试频道用本人账号演示。先用完整标题问入职指南，点开答案来源。再在同一线程问入职要完成哪些登记。使用会前验收通过的回执作备用。" },
  { id: "access", stage: 1, time: "2:30–3:45", say: "工作区已经装了 Tada。先确认 Slack 员工和频道权限。个人 Drive 只在需要读取本人有权访问的文件时连接。点开本页教程，让大家会后照着做。" },
  { id: "google", stage: 2, time: "3:45–4:20", say: "切到讲者版实际产出，展示从已授权的规格整理的表。说明哪项在本期，哪项排到后面。", prompt: "读这份 Google 文档：[粘贴链接]。把好友请求的通知入口整理成两列表，标出本期和后续。给出原文章节。" },
  { id: "slack", stage: 2, time: "4:20–4:55", say: "个人 Agent 用你自己的 Slack 权限搜索。切到讲者材料，打开实际消息，核对本期决定。", prompt: "用 Slack 搜索「连接请求」「铃铛」。找出这版通知范围的更新，给出决定和消息链接。只读。" },
  { id: "combine", stage: 2, time: "4:55–6:00", say: "用已连接 Slack 和 Google 的个人 Agent 对照两处证据。展示新建文档里的当前入口、本期变化、后续项和两条原始链接。", prompt: "读 Slack 更新：[粘贴链接]。读 Google 规格：[粘贴链接]。写一份新的 Google Doc，区分当前入口、本期变化和后续项，引用两处来源。只回文档链接，等我审阅。" },
  { id: "finish", stage: 1, time: "6:00–6:30", say: "请同事用公司账号打开教程。已开通的员工先做一次权限检查，再问一个手头的真实问题。" },
];
const stages = [["People", "找到彼此"], ["Tada", "找到资料"], ["AI Agent", "完成工作"]];
const screen = document.querySelector("#screen");
const presenter = document.querySelector("#presenter");
const chapterSelect = document.querySelector("#chapters");
const language = document.querySelector("#language");
const notes = document.querySelector("#notes");
const prev = document.querySelector("#prev");
const next = document.querySelector("#next");
let current = 0;

function renderWindows(scene) {
  const reference = scene.querySelector("[data-reference-day]");
  if (!reference) return;

  const beijingDate = new Intl.DateTimeFormat("en-CA", {
    timeZone: "Asia/Shanghai", year: "numeric", month: "2-digit", day: "2-digit",
  });
  const date = Object.fromEntries(beijingDate.formatToParts(new Date()).map(part => [part.type, part.value]));
  const dateLabel = [date.year, date.month, date.day].join("-");
  const utcMidnight = Date.UTC(Number(date.year), Number(date.month) - 1, Number(date.day));
  // 08:00 and 22:00 in Beijing start at 00:00 and 14:00 UTC.
  const windows = [[0, 2], [14, 16]];
  reference.textContent = dateLabel;
  reference.dateTime = dateLabel;

  for (const row of scene.querySelectorAll("[data-zone]")) {
    const formatter = new Intl.DateTimeFormat("en-CA", {
      timeZone: row.dataset.zone, year: "numeric", month: "2-digit", day: "2-digit",
      hour: "2-digit", minute: "2-digit", hourCycle: "h23",
    });
    row.querySelectorAll("[data-window]").forEach((cell, index) => {
      const [start, end] = windows[index].map(hour => Object.fromEntries(
        formatter.formatToParts(utcMidnight + hour * 3_600_000).map(part => [part.type, part.value]),
      ));
      cell.textContent = `${start.hour}:${start.minute}–${end.hour}:${end.minute}`;
      if ([start.year, start.month, start.day].join("-") < dateLabel) {
        const english = document.createElement("span");
        english.lang = "en";
        english.textContent = " · Prev. day";
        const chinese = document.createElement("span");
        chinese.lang = "zh-Hans";
        chinese.className = "cn";
        chinese.textContent = " · 前一天";
        cell.append(english, chinese);
      }
    });
  }
}

function setLanguage(value) {
  language.value = value;
  screen.dataset.language = value;
  screen.classList.toggle("no-chinese", value === "en");
  document.documentElement.lang = value === "zh" ? "zh-Hans" : "en";
}

function show(index) {
  const chapter = chapters[index];
  if (!chapter) return;

  current = index;
  const scene = document.getElementById(chapter.id).content.firstElementChild.cloneNode(true);
  const mast = document.createElement("div");
  mast.className = "mast";
  const track = stages.map(([en, zh], step) => `<li${step === chapter.stage ? ' class="on" aria-current="step"' : ""}><span lang="en">${en}</span><span class="cn" lang="zh-Hans">${zh}</span></li>`).join("");
  mast.innerHTML = `<ol class="track">${track}</ol><span>${String(index + 1).padStart(2, "0")} / ${String(chapters.length).padStart(2, "0")}</span>`;
  scene.prepend(mast);
  scene.querySelectorAll("[data-guide]").forEach(link => { link.href = guideUrl; });
  renderWindows(scene);
  screen.replaceChildren(scene);
  chapterSelect.value = String(index);
  prev.disabled = index === 0;
  next.disabled = index === chapters.length - 1;
}

function openNotes() {
  const chapter = chapters[current];
  notes.querySelector("h2").textContent = `${chapter.time} · ${screen.querySelector(".scene").dataset.label}`;
  const content = document.querySelector("#note-content");
  const copy = document.createElement("p");
  copy.textContent = chapter.say;
  content.replaceChildren(copy);
  if (chapter.prompt) {
    const box = document.createElement("div");
    box.className = "request-box";
    const label = document.createElement("label");
    label.htmlFor = "speaker-prompt";
    label.textContent = "可复制的问法";
    const field = document.createElement("textarea");
    field.id = "speaker-prompt";
    field.readOnly = true;
    field.value = chapter.prompt;
    const button = document.createElement("button");
    button.type = "button";
    button.textContent = "复制";
    const status = document.createElement("span");
    status.setAttribute("role", "status");
    button.addEventListener("click", () => {
      const select = () => {
        field.focus();
        field.select();
        status.textContent = "已选中，按 ⌘C 或 Ctrl+C 复制。";
      };
      if (!navigator.clipboard?.writeText) {
        select();
        return;
      }
      navigator.clipboard.writeText(field.value).then(() => { status.textContent = "已复制。"; }, select);
    });
    box.append(label, field, button, status);
    content.append(box);
  }
  notes.showModal();
}

async function toggleFullscreen() {
  try {
    if (document.fullscreenElement) await document.exitFullscreen();
    else await presenter.requestFullscreen();
  } catch {
    document.querySelector("#full").textContent = "Use browser full screen";
  }
}

chapters.forEach((chapter, index) => {
  const title = document.getElementById(chapter.id).content.firstElementChild.dataset.label;
  chapterSelect.add(new Option(`${index + 1}. ${title}`, index));
});
prev.addEventListener("click", () => show(current - 1));
next.addEventListener("click", () => show(current + 1));
chapterSelect.addEventListener("change", () => show(Number(chapterSelect.value)));
language.addEventListener("change", () => setLanguage(language.value));
document.querySelector("#speaker").addEventListener("click", openNotes);
document.querySelector("#close-notes").addEventListener("click", () => notes.close());
document.querySelector("#full").addEventListener("click", toggleFullscreen);
document.addEventListener("keydown", event => {
  if (event.repeat || notes.open || event.target.closest("select, a, textarea") ||
      event.ctrlKey || event.altKey || event.metaKey) return;
  switch (event.key.toLowerCase()) {
    case "arrowright":
    case "pagedown":
      event.preventDefault();
      show(current + 1);
      break;
    case "arrowleft":
    case "pageup":
      event.preventDefault();
      show(current - 1);
      break;
    case " ":
      if (event.target.closest("button")) break;
      event.preventDefault();
      show(current + 1);
      break;
    case "f": toggleFullscreen(); break;
    case "c": {
      const modes = ["both", "en", "zh"];
      setLanguage(modes[(modes.indexOf(language.value) + 1) % modes.length]);
      break;
    }
    case "r": show(current); break;
    case "n": openNotes(); break;
  }
});
show(0);
</script>
</body>
</html>
